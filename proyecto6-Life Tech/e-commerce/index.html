<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=1280"/>
  <title>Life Tech · Storefront</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
/* =========================================================
   Life Tech — Design Tokens & Base Styles
   ========================================================= */

/* Fonts — pull from Google Fonts. Self-host later if needed.
   Add this to your <head> alongside this CSS:
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

   Lucide icons — drop this <script> at end of <body>:
   <script src="https://unpkg.com/lucide@latest"></script>
   <script>lucide.createIcons();</script>
   Use as: <i data-lucide="shopping-cart"></i>
*/

:root {
  /* ---------- COLOR — neutrals (dark-first) ---------- */
  --bg:            #050506;   /* page background, near-black */
  --bg-grid:       #0d0d10;   /* subtle 1px grid behind cards */
  --surface:       #0e0e11;   /* card / panel */
  --surface-2:     #15151a;   /* elevated surface, hover targets */
  --surface-3:     #1d1d23;   /* most-elevated (modals, dropdowns) */
  --border:        #26262e;   /* default border */
  --border-strong: #3a3a44;   /* focused / active border */
  --border-subtle: #1a1a20;   /* hairlines inside cards */

  /* ---------- COLOR — foreground ---------- */
  --fg:            #f5f5f7;   /* primary text */
  --fg-2:          #b8b8c0;   /* secondary text */
  --fg-3:          #71717a;   /* muted, captions */
  --fg-4:          #44444c;   /* disabled, very low emphasis */
  --fg-on-brand:   #ffffff;   /* text on red brand fills */

  /* ---------- COLOR — brand ---------- */
  --brand-red:        #ef2b2b;  /* primary brand */
  --brand-red-hover:  #ff3b3b;
  --brand-red-press:  #d91a1a;
  --brand-red-soft:   #2a0d10;  /* tinted dark surface */
  --brand-red-glow:   rgb(239 43 43 / 0.45);

  /* ---------- COLOR — neon accents (use sparingly) ---------- */
  --neon-yellow:      #ffe600;  /* "live" / online / available */
  --neon-violet:      #a855f7;  /* AI / smart features */
  --neon-magenta:     #f0f;     /* rare hero accent only */
  /* legacy aliases — keep until kits are migrated */
  --neon-lime:        var(--neon-yellow);
  --neon-cyan:        var(--neon-violet);

  /* ---------- COLOR — semantic ---------- */
  --success:    #a855f7;
  --warning:    #f59e0b;
  --danger:     #ef2b2b;       /* same as brand — by design */
  --info:       #22d3ee;

  /* ---------- TYPE — families ---------- */
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-display: "Inter", ui-sans-serif, system-ui, sans-serif; /* same family, weight 900 */

  /* ---------- TYPE — sizes ---------- */
  --fs-display-xl: clamp(56px, 9vw, 128px);
  --fs-display:    clamp(40px, 6vw, 80px);
  --fs-h1:         clamp(32px, 4vw, 56px);
  --fs-h2:         clamp(24px, 3vw, 40px);
  --fs-h3:         24px;
  --fs-h4:         18px;
  --fs-body-lg:    18px;
  --fs-body:       15px;
  --fs-body-sm:    13px;
  --fs-caption:    12px;
  --fs-overline:   11px;

  /* ---------- TYPE — weights ---------- */
  --fw-regular:  400;
  --fw-medium:   500;
  --fw-semibold: 600;
  --fw-bold:     700;
  --fw-heavy:    800;
  --fw-black:    900;

  /* ---------- TYPE — line height & tracking ---------- */
  --lh-tight:   1.0;
  --lh-snug:    1.15;
  --lh-normal:  1.5;
  --lh-loose:   1.7;

  --ls-display: -0.04em;
  --ls-tight:   -0.02em;
  --ls-normal:  0em;
  --ls-mono:    -0.01em;
  --ls-overline: 0.12em;

  /* ---------- SPACING ---------- */
  --space-0:   0;
  --space-1:   4px;
  --space-2:   8px;
  --space-3:   12px;
  --space-4:   16px;
  --space-5:   24px;
  --space-6:   32px;
  --space-7:   48px;
  --space-8:   64px;
  --space-9:   96px;
  --space-10:  128px;

  --gutter: clamp(16px, 4vw, 64px);
  --content-max: 1280px;

  /* ---------- RADIUS ---------- */
  --radius-1: 4px;    /* chips, badges */
  --radius-2: 8px;    /* buttons, inputs */
  --radius-3: 12px;   /* cards */
  --radius-4: 20px;   /* sheets, modals */
  --radius-pill: 999px;

  /* ---------- SHADOW ---------- */
  --shadow-card:      0 8px 24px -12px rgb(0 0 0 / 0.6);
  --shadow-elevated:  0 24px 48px -16px rgb(0 0 0 / 0.8);
  --shadow-glow-red:  0 0 40px -8px var(--brand-red-glow);
  --shadow-glow-red-strong: 0 0 56px -4px rgb(239 43 43 / 0.6);
  --shadow-inner-focus: inset 0 0 0 1px var(--brand-red);

  /* ---------- MOTION ---------- */
  --ease-out:    cubic-bezier(0.22, 1, 0.36, 1);   /* punchy out-quint */
  --ease-in:     cubic-bezier(0.64, 0, 0.78, 0);
  --ease-in-out: cubic-bezier(0.83, 0, 0.17, 1);
  --t-fast:   150ms;
  --t-base:   220ms;
  --t-slow:   400ms;

  /* ---------- LAYOUT ---------- */
  --header-h: 64px;
  --z-header: 50;
  --z-sheet:  60;
  --z-modal:  70;
  --z-toast:  80;
}

/* =========================================================
   Base elements
   ========================================================= */

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: var(--lh-normal);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body.lt {
  background-image:
    radial-gradient(circle at 20% -10%, rgb(239 43 43 / 0.08), transparent 50%),
    radial-gradient(circle at 80% 110%, rgb(34 211 238 / 0.04), transparent 60%);
  background-attachment: fixed;
}

::selection { background: var(--brand-red); color: var(--fg-on-brand); }

/* ---------- Type primitives ---------- */
.lt-display-xl,
h1.display {
  font: var(--fw-black) var(--fs-display-xl)/var(--lh-tight) var(--font-display);
  letter-spacing: var(--ls-display);
  margin: 0;
}
.lt-display,
h1 {
  font: var(--fw-black) var(--fs-display)/var(--lh-tight) var(--font-display);
  letter-spacing: var(--ls-display);
  margin: 0;
}
h2 {
  font: var(--fw-bold) var(--fs-h1)/var(--lh-snug) var(--font-sans);
  letter-spacing: var(--ls-tight);
  margin: 0;
}
h3 {
  font: var(--fw-bold) var(--fs-h2)/var(--lh-snug) var(--font-sans);
  letter-spacing: var(--ls-tight);
  margin: 0;
}
h4 {
  font: var(--fw-semibold) var(--fs-h3)/var(--lh-snug) var(--font-sans);
  letter-spacing: var(--ls-tight);
  margin: 0;
}
h5 {
  font: var(--fw-semibold) var(--fs-h4)/var(--lh-snug) var(--font-sans);
  margin: 0;
}
p { margin: 0; }

.lt-body-lg { font-size: var(--fs-body-lg); line-height: var(--lh-normal); }
.lt-body    { font-size: var(--fs-body);    line-height: var(--lh-normal); }
.lt-body-sm { font-size: var(--fs-body-sm); line-height: var(--lh-normal); color: var(--fg-2); }
.lt-caption { font-size: var(--fs-caption); color: var(--fg-3); }
.lt-overline {
  font-size: var(--fs-overline);
  letter-spacing: var(--ls-overline);
  text-transform: uppercase;
  font-weight: var(--fw-semibold);
  color: var(--fg-3);
}

.lt-mono {
  font-family: var(--font-mono);
  letter-spacing: var(--ls-mono);
  font-feature-settings: "ss01", "zero";
}

a {
  color: var(--fg);
  text-decoration: none;
  position: relative;
}
a.lt-link {
  background-image: linear-gradient(var(--brand-red), var(--brand-red));
  background-size: 0% 1px;
  background-position: 0 100%;
  background-repeat: no-repeat;
  transition: background-size var(--t-base) var(--ease-out);
}
a.lt-link:hover { background-size: 100% 1px; }

code, kbd, samp { font-family: var(--font-mono); font-size: 0.92em; }

hr {
  border: 0;
  border-top: 1px solid var(--border);
  margin: var(--space-6) 0;
}

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

/* ---------- Reusable utility blocks ---------- */
.lt-container {
  max-width: var(--content-max);
  margin: 0 auto;
  padding-inline: var(--gutter);
}

.lt-grid-bg {
  background-image:
    linear-gradient(var(--bg-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
  background-size: 48px 48px;
}

/* live indicator dot — used for stock, online, AI status */
.lt-live-dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 999px;
  background: var(--neon-yellow);
  box-shadow: 0 0 0 4px rgb(255 230 0 / 0.18);
  animation: lt-pulse 1.4s ease-in-out infinite;
}
@keyframes lt-pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.55; transform: scale(0.92); }
}

/* keyframes used elsewhere */
@keyframes lt-fade-up {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes lt-glow-in {
  from { box-shadow: 0 0 0 -4px transparent; }
  to   { box-shadow: var(--shadow-glow-red); }
}

/* UI kit storefront — uses tokens from /colors_and_type.css */

body { background: var(--bg); color: var(--fg); font-family: var(--font-sans); }

/* ---- Layout ---- */
.lt-app { min-height: 100vh; display: flex; flex-direction: column; }
.lt-main { flex: 1; }

/* ---- Header ---- */
.lt-header {
  position: sticky; top: 0; z-index: 50;
  height: 64px; display: flex; align-items: center;
  padding-inline: var(--gutter);
  background: rgb(5 5 6 / 0.72);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  gap: 32px;
}
.lt-logo {
  font: var(--fw-black) 22px/1 var(--font-display);
  letter-spacing: -0.05em;
  color: var(--fg);
  position: relative;
  cursor: pointer;
  user-select: none;
}
.lt-logo .dot {
  position: absolute; right: -7px; bottom: 3px;
  width: 6px; height: 6px; border-radius: 999px;
  background: var(--brand-red);
  box-shadow: 0 0 10px 1px rgb(239 43 43 / 0.6);
}
.lt-nav { display: flex; gap: 24px; }
.lt-nav a {
  font: var(--fw-medium) 13px/1 var(--font-sans);
  color: var(--fg-2); cursor: pointer; padding: 6px 0;
  position: relative;
  transition: color var(--t-fast) var(--ease-out);
}
.lt-nav a:hover { color: var(--fg); }
.lt-nav a.active { color: var(--fg); }
.lt-nav a.active::after {
  content:""; position:absolute; left:0; right:0; bottom:-22px;
  height:2px; background: var(--brand-red);
  box-shadow: 0 0 10px 0 var(--brand-red);
}
.lt-nav a.hot { color: var(--brand-red); }

.lt-search {
  display: flex; align-items: center; gap: 8px;
  height: 36px; padding: 0 12px;
  border: 1px solid var(--border); border-radius: var(--radius-2);
  background: var(--surface); color: var(--fg-3);
  font: 400 13px/1 var(--font-sans);
  width: 220px; cursor: text;
  transition: all var(--t-fast) var(--ease-out);
}
.lt-search:hover { border-color: var(--border-strong); }
.lt-search input { background: transparent; border:0; outline: 0; color: var(--fg); flex:1; font: inherit; }
.lt-spacer { margin-left: auto; }
.lt-icon-btn {
  width: 36px; height: 36px;
  border-radius: var(--radius-2);
  background: var(--surface); border: 1px solid var(--border);
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--fg-2); cursor: pointer; position: relative;
  transition: all var(--t-fast) var(--ease-out);
}
.lt-icon-btn:hover { color: var(--fg); border-color: var(--border-strong); }
.lt-count {
  position: absolute; top: -5px; right: -5px;
  background: var(--brand-red); color: #fff;
  font: 700 9px/1 var(--font-sans);
  min-width: 18px; height: 18px; border-radius: 999px;
  padding: 0 5px; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 10px -2px var(--brand-red-glow);
}

/* ---- Buttons ---- */
.lt-btn {
  font: var(--fw-semibold) 14px/1 var(--font-sans);
  border-radius: var(--radius-2);
  padding: 0 18px; height: 42px;
  cursor: pointer;
  border: 1px solid transparent;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: all var(--t-base) var(--ease-out);
  white-space: nowrap;
}
.lt-btn:active { transform: scale(0.98); }
.lt-btn--primary { background: var(--brand-red); color: var(--fg-on-brand); box-shadow: var(--shadow-glow-red); }
.lt-btn--primary:hover { background: var(--brand-red-hover); box-shadow: var(--shadow-glow-red-strong); transform: translateY(-1px); }
.lt-btn--secondary { background: var(--surface-2); color: var(--fg); border-color: var(--border); }
.lt-btn--secondary:hover { border-color: var(--border-strong); background: var(--surface-3); }
.lt-btn--ghost { background: transparent; color: var(--fg); }
.lt-btn--ghost:hover { background: var(--surface-2); }
.lt-btn--lg { height: 52px; padding: 0 24px; font-size: 15px; }
.lt-btn--block { width: 100%; }
.lt-btn--icon { width: 42px; padding: 0; }

/* ---- Inputs ---- */
.lt-input {
  font: 400 14px/1 var(--font-sans);
  background: var(--surface); color: var(--fg);
  border: 1px solid var(--border);
  border-radius: var(--radius-2);
  padding: 0 14px; height: 44px; outline: none;
  width: 100%;
  transition: all var(--t-fast) var(--ease-out);
}
.lt-input:focus { border-color: var(--brand-red); box-shadow: 0 0 0 3px rgb(239 43 43 / 0.15); }
.lt-input::placeholder { color: var(--fg-3); }
.lt-field { display: flex; flex-direction: column; gap: 6px; }
.lt-field label {
  font: var(--fw-semibold) 11px/1 var(--font-sans);
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-3);
}

/* ---- Badge ---- */
.lt-badge {
  font: var(--fw-semibold) 11px/1 var(--font-sans);
  letter-spacing: 0.04em;
  height: 24px; padding: 0 10px;
  border-radius: 999px;
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid transparent;
}
.lt-badge--red { background: var(--brand-red); color: #fff; box-shadow: 0 0 12px -2px rgb(239 43 43 / 0.55); }
.lt-badge--soft { background: rgb(239 43 43 / 0.12); color: var(--brand-red); border-color: rgb(239 43 43 / 0.3); }
.lt-badge--lime { background: rgb(182 255 60 / 0.12); color: var(--neon-lime); border-color: rgb(182 255 60 / 0.35); }
.lt-badge--cyan { background: rgb(34 211 238 / 0.12); color: var(--neon-cyan); border-color: rgb(34 211 238 / 0.35); }
.lt-badge--warn { background: rgb(245 158 11 / 0.12); color: var(--warning); border-color: rgb(245 158 11 / 0.35); }
.lt-badge--ghost { background: transparent; color: var(--fg-2); border-color: var(--border); }

/* ---- Product card ---- */
.lt-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-3);
  padding: 16px;
  display: flex; flex-direction: column; gap: 10px;
  position: relative; overflow: hidden;
  transition: all var(--t-base) var(--ease-out);
  cursor: pointer;
}
.lt-card:hover {
  border-color: var(--border-strong);
  transform: translateY(-3px);
  box-shadow: var(--shadow-glow-red);
}
.lt-card--featured {
  border-color: var(--brand-red);
  box-shadow: var(--shadow-glow-red);
}
.lt-card-img {
  height: 160px; border-radius: var(--radius-2);
  background:
    radial-gradient(circle at 50% 60%, rgb(239 43 43 / 0.22) 0%, rgb(14 14 17 / 0) 60%),
    linear-gradient(180deg, #0c0c0f 0%, #050506 100%);
  display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
  border: 1px solid var(--border-subtle);
}
.lt-card-img::before {
  content:""; position: absolute; inset:0;
  background-image:
    linear-gradient(var(--bg-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
  background-size: 32px 32px;
  opacity: 0.4;
  -webkit-mask-image: radial-gradient(circle, transparent 30%, #000 80%);
  mask-image: radial-gradient(circle, transparent 30%, #000 80%);
}
.lt-card-img svg { position: relative; z-index:1; transition: transform var(--t-base) var(--ease-out); }
.lt-card:hover .lt-card-img svg { transform: scale(1.06); }
.lt-card-name { font: 700 15px/1.2 var(--font-sans); letter-spacing: -0.01em; color: var(--fg); }
.lt-card-tag { font: 400 12px/1.4 var(--font-sans); color: var(--fg-3); }
.lt-card-bot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 4px; }
.lt-price { font: 700 17px/1 var(--font-sans); color: var(--fg); }
.lt-price s { color: var(--fg-3); font-weight: 400; font-size: 12px; margin-right: 6px; }
.lt-card-corner {
  position: absolute; top: 12px; left: 12px; z-index: 2;
  display: flex; flex-direction: column; gap: 6px; align-items: flex-start;
}
.lt-card-fav {
  position: absolute; top: 12px; right: 12px; z-index: 2;
  width: 30px; height: 30px;
  border-radius: 999px; background: rgb(5 5 6 / 0.6);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  color: var(--fg-2); cursor: pointer;
  backdrop-filter: blur(6px);
}
.lt-card-fav.on { color: var(--brand-red); border-color: var(--brand-red); }
.lt-card-fav svg { width: 14px; height: 14px; stroke-width: 1.75; fill: none; stroke: currentColor; }
.lt-card-fav.on svg { fill: currentColor; }

/* ---- Live dot ---- */
.lt-live { display:inline-block; width: 8px; height: 8px; border-radius: 999px; background: var(--neon-lime); box-shadow: 0 0 0 4px rgb(182 255 60 / 0.18); animation: lt-pulse 1.4s ease-in-out infinite; }

/* ---- Sheet (cart side panel) ---- */
.lt-backdrop {
  position: fixed; inset: 0; z-index: 60;
  background: rgb(0 0 0 / 0.65);
  backdrop-filter: blur(4px);
  animation: lt-fade-in var(--t-base) var(--ease-out);
}
@keyframes lt-fade-in { from { opacity: 0 } to { opacity: 1 } }
.lt-sheet {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 61;
  width: 100%; max-width: 460px;
  background: var(--surface);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  animation: lt-slide-in var(--t-slow) var(--ease-out);
  box-shadow: var(--shadow-elevated);
}
@keyframes lt-slide-in  { from { transform: translateX(100%) } to { transform: translateX(0) } }
@keyframes lt-scale-in  { from { opacity: 0; transform: translate(-50%,-50%) scale(0.92) } to { opacity:1; transform: translate(-50%,-50%) scale(1) } }
@keyframes lt-chat-pop  { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: translateY(0) } }

/* Chat widget — no puede ser sobreescrito */
.lt-chat-widget {
  position: fixed !important;
  bottom: 24px !important;
  right: 24px !important;
  width: 360px !important;
  height: 500px !important;
  max-height: 500px !important;
  min-height: unset !important;
  flex: none !important;
  align-self: auto !important;
  z-index: 9999;
  background: #0e0e12;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 8px 48px rgba(0,0,0,0.6);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: lt-chat-pop .25s cubic-bezier(0.34,1.56,0.64,1);
}

/* ---- Hero ---- */
.lt-hero {
  position: relative; overflow: hidden;
  padding: 96px var(--gutter) 80px;
}
.lt-hero-bg {
  position: absolute; inset: 0; z-index: 0;
  background:
    radial-gradient(circle at 75% 50%, rgb(239 43 43 / 0.22) 0%, transparent 50%),
    radial-gradient(circle at 20% 30%, rgb(34 211 238 / 0.06) 0%, transparent 40%);
}
.lt-hero-grid {
  position: absolute; inset: 0; z-index: 0;
  background-image:
    linear-gradient(var(--bg-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
  background-size: 64px 64px;
  -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, #000 0%, transparent 100%);
  mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, #000 0%, transparent 100%);
  opacity: 0.6;
}
.lt-hero-inner {
  position: relative; z-index: 1;
  max-width: var(--content-max); margin: 0 auto;
  display: grid; grid-template-columns: 1.2fr 1fr; gap: 48px; align-items: center;
}
@media (max-width: 920px) { .lt-hero-inner { grid-template-columns: 1fr; } }

/* ---- Section ---- */
.lt-section { padding: 64px var(--gutter); position: relative; }
.lt-section-inner { max-width: var(--content-max); margin: 0 auto; }
.lt-section-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 32px; }
.lt-section-title { font: 700 32px/1.1 var(--font-sans); letter-spacing: -0.02em; }
.lt-section-title .red { color: var(--brand-red); }
.lt-section-sub { font: 400 14px/1 var(--font-sans); color: var(--fg-3); }

.lt-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
@media (max-width: 1100px) { .lt-grid-4 { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 800px)  { .lt-grid-4 { grid-template-columns: repeat(2, 1fr); } }

/* ---- Footer ---- */
.lt-footer {
  border-top: 1px solid var(--border);
  padding: 48px var(--gutter) 32px;
  background: var(--bg-grid);
}
.lt-footer-inner { max-width: var(--content-max); margin: 0 auto; display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 48px; }
@media (max-width: 800px) { .lt-footer-inner { grid-template-columns: 1fr 1fr; } }
.lt-footer h6 { font: 600 11px/1 var(--font-sans); letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 16px; }
.lt-footer ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.lt-footer ul a { color: var(--fg-2); font-size: 13px; cursor: pointer; }
.lt-footer ul a:hover { color: var(--fg); }
.lt-footer-bot { max-width: var(--content-max); margin: 32px auto 0; padding-top: 24px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; color: var(--fg-3); font-size: 12px; }

/* ---- Toast ---- */
.lt-toast-stack { position: fixed; bottom: 24px; right: 24px; z-index: 80; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.lt-toast {
  pointer-events: auto;
  min-width: 280px; max-width: 360px;
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-left: 3px solid var(--brand-red);
  border-radius: var(--radius-3);
  background: var(--surface-2);
  display: flex; gap: 12px; align-items: center;
  box-shadow: var(--shadow-elevated);
  animation: lt-toast-in var(--t-slow) var(--ease-out);
}
@keyframes lt-toast-in { from { opacity: 0; transform: translateY(12px) translateX(8px) } to { opacity: 1; transform: translateY(0) } }
@keyframes lt-dot-bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .4 } 40% { transform: translateY(-5px); opacity: 1 } }
@keyframes lt-spin      { to { transform: rotate(360deg); } }
@keyframes lt-scale-in  { from { opacity: 0; transform: scale(0.93) } to { opacity: 1; transform: scale(1) } }
@keyframes lt-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgb(182 255 60 / 0.5) } 50% { box-shadow: 0 0 0 5px rgb(182 255 60 / 0) } }
@keyframes lt-float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-14px); } }

/* ================================================================
   MOTION SYSTEM v2 — Life Tech storefront
   Dark-room gaming aesthetic: particles, reveals, reactive surfaces
   ================================================================ */

/* ---- Reduced motion safety ---- */
@media (prefers-reduced-motion: reduce) {
  .lt-reveal, .lt-reveal--scale, .lt-reveal--left { transition: none !important; opacity: 1 !important; transform: none !important; }
  .lt-hero-bg-anim, .lt-bg-orb, .lt-badge--red, .lt-card::after { animation: none !important; }
  .lt-btn::after { display: none !important; }
}

/* ================================================================
   PAGE BACKGROUND — slow-breathing glow orbs
   ================================================================ */
body.lt::before {
  content: '';
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(ellipse 60% 50% at 15% 20%, rgb(239 43 43 / 0.07) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 85% 75%, rgb(168 85 247 / 0.04) 0%, transparent 55%),
    radial-gradient(ellipse 40% 35% at 50% 105%, rgb(239 43 43 / 0.05) 0%, transparent 50%);
  animation: lt-orbs-drift 18s ease-in-out infinite alternate;
}
@keyframes lt-orbs-drift {
  0%   { opacity: 0.7; background-position: 0% 0%; }
  33%  { opacity: 1; }
  66%  { opacity: 0.8; }
  100% { opacity: 1; background-position: 3% 5%; }
}

/* ================================================================
   HERO — animated gradient pulse
   ================================================================ */
.lt-hero-bg {
  animation: lt-hero-breathe 9s ease-in-out infinite;
}
@keyframes lt-hero-breathe {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.65; }
}

/* ================================================================
   SCROLL REVEAL — base state (hidden) → visible
   ================================================================ */
.lt-reveal {
  opacity: 0;
  transform: translateY(28px);
  transition: opacity 0.65s var(--ease-out), transform 0.65s var(--ease-out);
}
.lt-reveal.visible {
  opacity: 1;
  transform: translateY(0);
}

.lt-reveal--scale {
  opacity: 0;
  transform: scale(0.94) translateY(16px);
  transition: opacity 0.55s var(--ease-out), transform 0.55s var(--ease-out);
}
.lt-reveal--scale.visible {
  opacity: 1;
  transform: scale(1) translateY(0);
}

.lt-reveal--left {
  opacity: 0;
  transform: translateX(-20px);
  transition: opacity 0.55s var(--ease-out), transform 0.55s var(--ease-out);
}
.lt-reveal--left.visible {
  opacity: 1;
  transform: translateX(0);
}

/* ---- Stagger delay utilities ---- */
.lt-d1 { transition-delay: 0.05s !important; }
.lt-d2 { transition-delay: 0.12s !important; }
.lt-d3 { transition-delay: 0.19s !important; }
.lt-d4 { transition-delay: 0.26s !important; }
.lt-d5 { transition-delay: 0.33s !important; }
.lt-d6 { transition-delay: 0.40s !important; }
.lt-d7 { transition-delay: 0.47s !important; }
.lt-d8 { transition-delay: 0.54s !important; }

/* ================================================================
   PRODUCT CARD — reactive inner glow + entrance
   ================================================================ */
.lt-card::after {
  content: '';
  position: absolute; inset: 0;
  border-radius: var(--radius-3);
  background: radial-gradient(
    circle at var(--card-mx, 50%) var(--card-my, 50%),
    rgb(239 43 43 / 0.08) 0%, transparent 55%
  );
  opacity: 0;
  transition: opacity 0.3s var(--ease-out);
  pointer-events: none;
  z-index: 0;
}
.lt-card:hover::after { opacity: 1; }

/* Card grid entrance — each card fades+slides up with stagger */
.lt-card-enter {
  animation: lt-card-in 0.5s var(--ease-out) both;
}
@keyframes lt-card-in {
  from { opacity: 0; transform: translateY(20px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* ================================================================
   BUTTON — ripple effect on click
   ================================================================ */
.lt-btn { position: relative; overflow: hidden; }
.lt-btn-ripple {
  position: absolute;
  border-radius: 50%;
  transform: scale(0);
  animation: lt-ripple-out 0.55s var(--ease-out) forwards;
  pointer-events: none;
  background: rgb(255 255 255 / 0.18);
}
.lt-btn--primary .lt-btn-ripple { background: rgb(255 255 255 / 0.22); }
@keyframes lt-ripple-out {
  to { transform: scale(4); opacity: 0; }
}

/* ================================================================
   BADGE — sale/new pulse glow
   ================================================================ */
.lt-badge--red {
  animation: lt-badge-glow 3s ease-in-out infinite;
}
@keyframes lt-badge-glow {
  0%, 100% { box-shadow: 0 0 10px -2px rgb(239 43 43 / 0.5); }
  50%       { box-shadow: 0 0 22px -2px rgb(239 43 43 / 0.85); }
}

/* ================================================================
   HEADER — enhanced active indicator slide
   ================================================================ */
.lt-nav a::after {
  content: '';
  position: absolute; left: 50%; right: 50%; bottom: -22px;
  height: 2px; background: var(--brand-red);
  box-shadow: 0 0 10px 0 var(--brand-red);
  transition: left 0.25s var(--ease-out), right 0.25s var(--ease-out);
}
.lt-nav a.active::after { left: 0; right: 0; }

/* ================================================================
   SECTION DIVIDER — red scanning line between sections
   ================================================================ */
.lt-section-scan {
  position: absolute; top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent 0%, rgb(239 43 43 / 0.25) 30%, rgb(239 43 43 / 0.5) 50%, rgb(239 43 43 / 0.25) 70%, transparent 100%);
  animation: lt-scan-slide 4s ease-in-out infinite;
}
@keyframes lt-scan-slide {
  0%, 100% { opacity: 0.4; transform: scaleX(0.6); }
  50%       { opacity: 1;   transform: scaleX(1); }
}

/* ================================================================
   LIVE DOT — updated green-yellow version
   ================================================================ */
.lt-live {
  animation: lt-live-pulse 1.6s ease-in-out infinite;
}
@keyframes lt-live-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgb(255 230 0 / 0.5); }
  50%       { box-shadow: 0 0 0 5px rgb(255 230 0 / 0); }
}

/* ================================================================
   PAGE TRANSITION — route change fade+lift
   ================================================================ */
.lt-page-in {
  animation: lt-page-enter 0.38s var(--ease-out) both;
}

  from { opacity: 0; transform: translateY(12px); }

// ---------- Button ----------
function Button({ variant = "primary", size, block, icon, children, onClick, type = "button", disabled }) {
  const cls = ["lt-btn", `lt-btn--${variant}`];
  if (size === "lg") cls.push("lt-btn--lg");
  if (block) cls.push("lt-btn--block");
  if (icon && !children) cls.push("lt-btn--icon");

  function handleClick(e) {
    // Ripple effect
    const btn = e.currentTarget;
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 1.8;
    const x = e.clientX - rect.left - size / 2;
    const y = e.clientY - rect.top  - size / 2;
    const ripple = document.createElement("span");
    ripple.className = "lt-btn-ripple";
    ripple.style.cssText = `width:${size}px;height:${size}px;left:${x}px;top:${y}px;`;
    btn.appendChild(ripple);
    ripple.addEventListener("animationend", () => ripple.remove());
    if (onClick) onClick(e);
  }

  return (
    <button type={type} className={cls.join(" ")} onClick={disabled ? undefined : handleClick} disabled={disabled}>
      {icon}{children}
    </button>
  );
}

// ---------- Product card ----------
function ProductCard({ product, onOpen, onAdd, fav, onFav, featured }) {
  // Normaliza stock: soporta número (API) o strings legacy ("ok" / "low")
  const stockNum =
    typeof product.stock === "number" ? product.stock :
    product.stock === "ok"  ? 999 :
    product.stock === "low" ? (product.stockN || 3) : 0;

  const isOut = stockNum === 0;
  const isLow = !isOut && stockNum <= 5;

  function handleMouseMove(e) {
    const rect = e.currentTarget.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width  * 100).toFixed(1);
    const y = ((e.clientY - rect.top)  / rect.height * 100).toFixed(1);
    e.currentTarget.style.setProperty("--card-mx", x + "%");
    e.currentTarget.style.setProperty("--card-my", y + "%");
  }

  return (
    <div
      className={"lt-card" + (featured || product.featured ? " lt-card--featured" : "")}
      onClick={() => onOpen?.(product)}
      onMouseMove={handleMouseMove}>
      <div className="lt-card-corner">
        {isOut && (
          <span className="lt-badge lt-badge--ghost" style={{ color: "var(--fg-4)", borderColor: "var(--border)" }}>Agotado</span>
        )}
        {!isOut && (product.badges || []).map((b, i) => (
          <span key={i} className={"lt-badge " + (b.startsWith("−") || b === "Nuevo" ? "lt-badge--red" : "lt-badge--ghost")}>{b}</span>
        ))}
      </div>

      <button className={"lt-card-fav" + (fav ? " on" : "")} onClick={(e) => { e.stopPropagation(); onFav?.(product); }}>
        <Icon name="heart" size={14} fill={fav}/>
      </button>

      {/* Imagen con overlay si está agotado */}
      <div className="lt-card-img" style={{ opacity: isOut ? 0.45 : 1, transition: "opacity .2s" }}>
        <ProductImg shape={product.shape} size={140} imageUrl={product.imageUrl}/>
      </div>

      {/* Estado de stock */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <span className="lt-overline" style={{ color: "var(--fg-3)" }}>{product.subcat}</span>
        {isLow && (
          <span className="lt-overline" style={{ color: "var(--warning)" }}>Quedan {stockNum}</span>
        )}
        {!isOut && !isLow && (
          <span style={{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: 11, color: "var(--neon-lime)" }}>
            <span className="lt-live"/>En stock
          </span>
        )}
      </div>

      <div className="lt-card-name">{product.name}</div>
      <div className="lt-card-tag">{product.tagline}</div>

      <div className="lt-card-bot">
        <span className="lt-price">
          {product.was && <s>${product.was.toLocaleString("en-US")}</s>}
          ${(product.price || 0).toLocaleString("en-US")}
        </span>

        {/* Botón Añadir / Agotado */}
        <button
          className="lt-btn lt-btn--primary"
          style={{
            height: 32, padding: "0 14px", fontSize: 12,
            ...(isOut ? {
              background: "var(--surface-2)",
              color: "var(--fg-4)",
              boxShadow: "none",
              cursor: "not-allowed",
              border: "1px solid var(--border)",
              transform: "none",
            } : {}),
          }}
          disabled={isOut}
          onClick={(e) => { e.stopPropagation(); if (!isOut) onAdd?.(product); }}
        >
          {isOut ? "Agotado" : "Añadir"}
        </button>
      </div>
    </div>
  );
}

async function apiLookupUser(email) {
  try {
    const r = await fetch(`http://localhost:3001/api/public/users/lookup?email=${encodeURIComponent(email)}`);
    if (r.status === 404) return null;
    if (!r.ok) return null;
    return await r.json();
  } catch { return null; }
}

async function apiRegisterUser(userData) {
  try {
    const r = await fetch("http://localhost:3001/api/public/users/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(userData),
    });
    if (!r.ok) return null;
    return await r.json();
  } catch { return null; }
}

    const words    = rawName.split(" ").filter(Boolean);
    const name     = words.map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ") || gEmail.split("@")[0];

function detectarJuego(texto) {
  const t = texto.toLowerCase();
  if (t.match(/valorant/)) return "valorant";
  if (t.match(/\bcs2\b|counter.strike|csgo/)) return "cs2";
  if (t.match(/fortnite|fornite/)) return "fortnite";
  if (t.match(/minecraft/)) return "minecraft";
  if (t.match(/gta|grand theft/)) return "gta";
  if (t.match(/apex/)) return "apex";
  if (t.match(/league of legends|\blol\b|leage/)) return "lol";
  if (t.match(/cyberpunk/)) return "cyberpunk";
  if (t.match(/fifa|ea fc|eafc/)) return "fifa";
  if (t.match(/roblox/)) return "roblox";
  if (t.match(/stream|twitch|youtube|content|contenido/)) return "streaming";
  if (t.match(/econ[oó]mi|barato|poco presupuesto|baja gama|gama baja|$1|$2|$3|1 mill|2 mill|3 mill/)) return "economico";
  if (t.match(/gama alta|high end|tope|premium|lo mejor|sin l[ií]mite|$10|$15|$20/)) return "gama_alta";
  return "default";
}

function parsearMarkdown(texto) {
  return texto
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/^• /gm, '&nbsp;&nbsp;• ')
    .split('\n')
    .map((line, i) => React.createElement('span', { key: i, dangerouslySetInnerHTML: { __html: line || '&nbsp;' }, style: { display: 'block', lineHeight: 1.55 } }));
}

// Home / landing screen for Life Tech storefront
const { useEffect: useEffectHome, useRef: useRefHome } = React;

// ── Particle field (canvas) — mounted inside the hero ──────────────────────
function ParticleField() {
  const ref = useRefHome(null);
  useEffectHome(() => {
    const canvas = ref.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");

    function resize() {
      canvas.width  = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    resize();
    const ro = new ResizeObserver(resize);
    ro.observe(canvas);

    // Generate particles
    const count = 70;
    const pts = Array.from({ length: count }, () => ({
      x:  Math.random(),
      y:  Math.random(),
      vx: (Math.random() - 0.5) * 0.00025,
      vy: (Math.random() - 0.5) * 0.00025,
      r:  Math.random() * 1.2 + 0.4,
      a:  Math.random() * 0.35 + 0.06,
      red: Math.random() < 0.14,       // 14% son rojos
    }));

    let raf;
    function draw() {
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0, 0, W, H);

      // Draw connecting lines between nearby particles
      for (let i = 0; i < pts.length; i++) {
        for (let j = i + 1; j < pts.length; j++) {
          const dx = (pts[i].x - pts[j].x) * W;
          const dy = (pts[i].y - pts[j].y) * H;
          const d  = Math.sqrt(dx * dx + dy * dy);
          if (d < 90) {
            ctx.beginPath();
            ctx.moveTo(pts[i].x * W, pts[i].y * H);
            ctx.lineTo(pts[j].x * W, pts[j].y * H);
            const alpha = (1 - d / 90) * 0.07;
            ctx.strokeStyle = `rgba(239,43,43,${alpha})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      }

      // Draw particles
      pts.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = 1; if (p.x > 1) p.x = 0;
        if (p.y < 0) p.y = 1; if (p.y > 1) p.y = 0;
        ctx.beginPath();
        ctx.arc(p.x * W, p.y * H, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.red
          ? `rgba(239,43,43,${p.a})`
          : `rgba(245,245,247,${p.a * 0.55})`;
        ctx.fill();
      });

      raf = requestAnimationFrame(draw);
    }
    draw();
    return () => { cancelAnimationFrame(raf); ro.disconnect(); };
  }, []);

  return (
    <canvas ref={ref} aria-hidden style={{
      position: "absolute", inset: 0, width: "100%", height: "100%",
      pointerEvents: "none", zIndex: 0,
    }}/>
  );
}

// ── Scroll reveal — registers Intersection Observer for .lt-reveal elements ──
function useScrollReveal() {
  useEffectHome(() => {
    const els = document.querySelectorAll(".lt-reveal, .lt-reveal--scale, .lt-reveal--left");
    if (!els.length) return;
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add("visible");
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.08, rootMargin: "0px 0px -40px 0px" });
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);
}

  const catProds = (products || []).filter(p => p.cat === cat);
  if (subcatId.startsWith("all-")) return catProds.length;
  const shapes = SUBCAT_SHAPES[subcatId];
  if (!shapes || shapes.length === 0) return 0;
  return catProds.filter(p => shapes.includes(p.shape)).length;
}

      return all.length > 0 ? all : BRANDS_FALLBACK.all;

function ShopScreen({ products, onAdd, onOpen, favs, onFav, initialCat, brands }) {
  const [filters, setFilters] = React.useState({ cat: initialCat || "all", subcat: null, brand: [], conn: [] });
  const [sort, setSort] = React.useState("relev");
  const [chatOpen, setChatOpen] = React.useState(false);

  // Sincroniza filters.cat cuando cambia la prop initialCat (navegación por header sin re-montar)
  React.useEffect(() => {
    setFilters(f => ({ ...f, cat: initialCat || "all", subcat: null }));
  }, [initialCat]);

  // Filtrado por categoría, subcategoría (shape), marca
  const list = (products || [])
    .filter(p => {
      if (filters.cat !== "all" && p.cat !== filters.cat) return false;
      // Filtro de subcategoría: usa el mapa shape ↔ subcatId
      if (filters.subcat && !filters.subcat.startsWith("all-")) {
        const shapes = SUBCAT_SHAPES[filters.subcat];
        if (shapes && shapes.length > 0 && !shapes.includes(p.shape)) return false;
      }
      if (filters.brand && filters.brand.length > 0 && !filters.brand.includes(p.brand)) return false;
      return true;
    })
    .sort((a, b) => {
      if (sort === "low")  return (a.price || 0) - (b.price || 0);
      if (sort === "high") return (b.price || 0) - (a.price || 0);
      return 0;
    });

  const catLabels = { all: "Todos los productos", perif: "Periféricos", comp: "Componentes", setup: "Setups" };

  // Etiqueta activa: subcategoría si hay, categoría si no
  const activeSubcat = filters.subcat
    ? (SUBCATS[filters.cat] || []).find(s => s.id === filters.subcat)?.label
    : null;
  const headingLabel = activeSubcat || catLabels[filters.cat] || "Todos";

  // Chips de filtros activos (para poder limpiarlos fácilmente)
  const activeFilters = [
    ...(filters.brand || []).map(b => ({ key: "brand", val: b, label: b })),
    ...(filters.conn  || []).map(c => ({ key: "conn",  val: c, label: c })),
  ];

  const clearFilter = (key, val) => setFilters(f => {
    const arr = (f[key] || []).filter(x => x !== val);
    return { ...f, [key]: arr };
  });

  return (
    <>
      <section className="lt-section" style={{ paddingTop: 32 }}>
        <div className="lt-section-inner">

              <div className="lt-section-eyebrow">
                Tienda &nbsp;/&nbsp; {headingLabel}
              </div>
              <h1 className="lt-shop-hero-h1">
                Construye tu{" "}
                <span style={{ color: "var(--brand-red)" }}>próximo nivel</span>
              </h1>
              <p style={{ font: "400 16px/1.5 var(--font-sans)", color: "var(--fg-2)", marginTop: 12, maxWidth: 520 }}>
                Filtra por marca, tipo y presupuesto. Si no sabes por dónde empezar, deja que la IA lo haga por ti.
              </p>
            </div>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "240px 1fr", gap: 32, alignItems: "flex-start" }}>
            <ShopFilters filters={filters} setFilters={setFilters} onChat={() => setChatOpen(true)} allBrands={brands} products={products}/>

            <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>

              {/* ── Barra de controles ── */}
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 16px", background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 12 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                  <span style={{ color: "var(--fg-2)", fontSize: 13 }}>
                    <span className="lt-mono" style={{ color: "var(--fg)", fontWeight: 600 }}>{list.length}</span> producto{list.length !== 1 ? "s" : ""}
                  </span>
                  {/* Chips de filtros activos */}
                  {activeFilters.map(af => (
                    <span key={af.key + af.val}
                      onClick={() => clearFilter(af.key, af.val)}
                      style={{
                        display: "inline-flex", alignItems: "center", gap: 5, height: 26,
                        padding: "0 10px", borderRadius: 999, fontSize: 11, fontWeight: 600,
                        background: "rgb(239 43 43 / 0.15)", color: "var(--brand-red)",

                  <span className="lt-overline" style={{ color: "var(--fg-3)" }}>Ordenar</span>
                  <select value={sort} onChange={e => setSort(e.target.value)}
                    style={{ background: "var(--surface-2)", color: "var(--fg)", border: "1px solid var(--border)", borderRadius: 8, height: 34, padding: "0 10px", font: "500 13px/1 var(--font-sans)" }}>
                    <option value="relev">Más relevante</option>
                    <option value="low">Precio: menor a mayor</option>
                    <option value="high">Precio: mayor a menor</option>
                  </select>
                </div>
              </div>

              {/* ── Grid de productos o estado vacío ── */}

                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(220px, 1fr))", gap: 16, animation: "lt-fade-in .2s ease" }}>

                    {(products || []).length === 0 ? "Catálogo vacío" : "Sin resultados"}
                  </div>
                  <div style={{ fontSize: 13 }}>
                    {(products || []).length === 0
                      ? "Aún no hay productos. Añádelos desde el panel de empleados."
                      : "Prueba con otra categoría o elimina los filtros de marca."}
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      </section>

      {chatOpen && <ChatBotPanel onClose={() => setChatOpen(false)}/>}
    </>
  );
}

  <script type="text/babel">
// Offers / deals listing screen

// Un producto tiene oferta si cumple alguna de estas condiciones:
function isOffer(p) {
  if (p.inOferta === true)             return true;
  if (p.was && p.was > p.price)        return true;
  if (p.save && p.save > 0)            return true;
  if ((p.badges || []).some(b => b.startsWith("−"))) return true;
  return false;
}

// Calcula el % de descuento de un producto
function discountPct(p) {
  if (p.save) return p.save;
  if (p.was && p.was > p.price) return Math.round((1 - p.price / p.was) * 100);
  const badge = (p.badges || []).find(b => b.startsWith("−"));
  if (badge) return parseInt(badge.replace("−", "").replace("%", ""), 10) || 0;
  return 0;
}

// Ahorro en pesos
function savings(p) {
  if (p.was && p.was > p.price) return p.was - p.price;
  if (p.save && p.was)          return p.was - p.price;
  return 0;
}

const CAT_LABELS = { all: "Todas", perif: "Periféricos", comp: "Componentes", setup: "Setups" };

// ── Tarjeta de oferta con el descuento muy visible ───────────────────────────
function OfferCard({ product, onAdd, onOpen, fav, onFav }) {
  const pct  = discountPct(product);
  const save = savings(product);
  const isOut = product.stock === 0 || product.stock === "out";

  return (
    <div style={{
      position: "relative",
      background: "var(--surface)", border: "1px solid var(--border)",
      borderRadius: 14, overflow: "hidden",
      display: "flex", flexDirection: "column",
      transition: "all .22s var(--ease-out)",
    }}
    onMouseEnter={e => { e.currentTarget.style.borderColor = "var(--brand-red)"; e.currentTarget.style.boxShadow = "var(--shadow-glow-red)"; }}
    onMouseLeave={e => { e.currentTarget.style.borderColor = "var(--border)";    e.currentTarget.style.boxShadow = "none"; }}>

      {/* Badge de descuento — esquina superior izquierda */}
      {pct > 0 && (
        <div style={{
          position: "absolute", top: 10, left: 10, zIndex: 2,
          background: "var(--brand-red)", color: "#fff",
          font: "800 14px/1 var(--font-display)", padding: "5px 10px", borderRadius: 8,
          letterSpacing: "-0.02em",
        }}>
          −{pct}%
        </div>
      )}

      {/* Fav */}
      <button
        onClick={e => { e.stopPropagation(); onFav(product); }}
        style={{ position: "absolute", top: 10, right: 10, zIndex: 2, background: "var(--surface-2)", border: "1px solid var(--border)", borderRadius: 8, width: 32, height: 32, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}>
        <Icon name="heart" size={14} fill={fav} style={fav ? { color: "var(--brand-red)" } : {}}/>
      </button>

      {/* Imagen */}
      <div
        onClick={() => onOpen(product)}
        style={{ cursor: "pointer", padding: "32px 24px 16px", background: "linear-gradient(180deg,#0c0c0f 0%,#050506 100%)", display: "flex", alignItems: "center", justifyContent: "center", minHeight: 160 }}>
        <ProductImg shape={product.shape} size={120} imageUrl={product.imageUrl}/>
      </div>

      {/* Info */}
      <div style={{ padding: "14px 16px 16px", display: "flex", flexDirection: "column", gap: 8, flex: 1 }}>
        <div style={{ font: "600 11px/1 var(--font-sans)", color: "var(--fg-3)", textTransform: "uppercase", letterSpacing: ".08em" }}>
          {product.brand} · {CAT_LABELS[product.cat] || product.cat}
        </div>

        <div onClick={() => onOpen(product)}
          style={{ font: "700 15px/1.2 var(--font-sans)", cursor: "pointer", letterSpacing: "-0.02em" }}>
          {product.name}
        </div>

        {/* Precios */}
        <div style={{ display: "flex", alignItems: "baseline", gap: 8, flexWrap: "wrap" }}>
          <span style={{ font: "800 20px/1 var(--font-display)", letterSpacing: "-0.03em" }}>
            ${product.price.toLocaleString("en-US")}
          </span>
          {product.was && (
            <span style={{ font: "400 13px/1 var(--font-sans)", color: "var(--fg-3)", textDecoration: "line-through" }}>
              ${product.was.toLocaleString("en-US")}
            </span>
          )}
        </div>

        {/* Ahorro destacado */}
        {save > 0 && (
          <div style={{ font: "600 12px/1 var(--font-sans)", color: "var(--brand-red)" }}>
            Ahorras ${save.toLocaleString("en-US")} USD
          </div>
        )}

        {/* Stock */}
        <div style={{ fontSize: 11, color: "var(--fg-3)", marginTop: 2 }}>
          {isOut
            ? <span style={{ color: "var(--fg-3)" }}>Agotado</span>
            : product.stock === "low"
              ? <span style={{ color: "#f59e0b" }}>⚠ Quedan solo {product.stockN}</span>
              : <><span className="lt-live"/>&nbsp;En stock · envío 24h</>}
        </div>

        {/* CTA */}
        <button
          disabled={isOut}
          onClick={() => onAdd(product, 1)}
          style={{
            marginTop: 6, height: 38, borderRadius: 8, border: 0, cursor: isOut ? "not-allowed" : "pointer",
            background: isOut ? "var(--surface-2)" : "var(--brand-red)", color: isOut ? "var(--fg-3)" : "#fff",
            font: "700 13px/1 var(--font-sans)", transition: "opacity .18s",
            opacity: isOut ? 0.5 : 1,
          }}
          onMouseEnter={e => { if (!isOut) e.currentTarget.style.opacity = ".85"; }}
          onMouseLeave={e => { e.currentTarget.style.opacity = "1"; }}>
          {isOut ? "Agotado" : "Añadir al carrito"}
        </button>
      </div>
    </div>
  );
}

// ── Pantalla principal de ofertas ─────────────────────────────────────────────
function OffersScreen({ products, onAdd, onOpen, favs, onFav }) {
  const { useState } = React;

  const [filterCat,   setFilterCat]   = useState("all");
  const [filterBrand, setFilterBrand] = useState([]);
  const [sort,        setSort]        = useState("pct");   // pct | low | high | new

  // Solo productos con oferta
  const offerProds = (products || []).filter(isOffer);

  // Categorías presentes en las ofertas (con conteo)
  const catsInOffers = ["all", "perif", "comp", "setup"].filter(id =>
    id === "all" || offerProds.some(p => p.cat === id)
  );

  // Marcas presentes en las ofertas del cat seleccionado
  const brandsInOffers = [...new Set(
    offerProds.filter(p => filterCat === "all" || p.cat === filterCat).map(p => p.brand).filter(Boolean)
  )].sort();

  const toggleBrand = (b) => setFilterBrand(prev => {
    const s = new Set(prev);
    s.has(b) ? s.delete(b) : s.add(b);
    return Array.from(s);
  });

  // Filtrado + ordenamiento
  const list = offerProds
    .filter(p => {
      if (filterCat !== "all" && p.cat !== filterCat) return false;
      if (filterBrand.length > 0 && !filterBrand.includes(p.brand)) return false;
      return true;
    })
    .sort((a, b) => {
      if (sort === "pct")  return discountPct(b) - discountPct(a);
      if (sort === "low")  return (a.price || 0) - (b.price || 0);
      if (sort === "high") return (b.price || 0) - (a.price || 0);
      if (sort === "new") {
        return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
      }
      return 0;
    });

  // Descuento máximo y ahorro total posible (para el hero)
  const maxPct   = offerProds.reduce((m, p) => Math.max(m, discountPct(p)), 0);
  const totalSave = list.reduce((s, p) => s + savings(p), 0);

  return (
    <section className="lt-section" style={{ paddingTop: 0 }}>

      {/* ── Hero banner ── */}
      <div className="lt-offers-hero">
        <div className="lt-offers-hero-inner">

            <span className="lt-live"/> Ofertas activas ahora
          </div>

            Hasta <span style={{ color: "var(--brand-red)" }}>−{maxPct}%</span><br/>de descuento
          </h1>
          <p style={{ font: "400 17px/1.5 var(--font-sans)", color: "var(--fg-2)", marginTop: 16, maxWidth: 520 }}>
            Precios rebajados en periféricos, componentes y setups completos. Stock limitado.
          </p>
          <div className="lt-offers-kpi">
            <div>
              <div className="lt-offers-kpi-val">{offerProds.length}</div>
              <div className="lt-offers-kpi-lbl">productos en oferta</div>
            </div>
            {totalSave > 0 && (
              <div>
                <div className="lt-offers-kpi-val" style={{ color: "var(--fg)" }}>${totalSave.toLocaleString("en-US")}</div>
                <div className="lt-offers-kpi-lbl">en ahorros (vista actual)</div>
              </div>
            )}
            <div>
              <div className="lt-offers-kpi-val">{maxPct}%</div>
              <div className="lt-offers-kpi-lbl">descuento máximo</div>
            </div>
          </div>
        </div>
      </div>

      {/* ── Contenido principal ── */}
      <div className="lt-section-inner" style={{ paddingTop: 36, paddingBottom: 64 }}>

        {/* ── Filtros de categoría (pills) ── */}
        <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", marginBottom: 28 }}>
          {catsInOffers.map(id => {
            const count = id === "all" ? offerProds.length : offerProds.filter(p => p.cat === id).length;
            const active = filterCat === id;
            return (
              <button key={id} onClick={() => { setFilterCat(id); setFilterBrand([]); }}
                style={{
                  height: 36, padding: "0 16px", borderRadius: 999, cursor: "pointer",
                  font: "600 13px/1 var(--font-sans)",
                  border: `1px solid ${active ? "var(--brand-red)" : "var(--border)"}`,
                  background: active ? "var(--brand-red)" : "var(--surface)",
                  color: active ? "#fff" : "var(--fg-2)",
                  transition: "all .18s var(--ease-out)",
                }}>
                {CAT_LABELS[id]} <span style={{ opacity: 0.75, fontSize: 11, marginLeft: 4 }}>({count})</span>
              </button>
            );

        </div>

        {offerProds.length === 0 ? (
          /* Estado vacío global */
          <div style={{ padding: "80px 0", textAlign: "center", color: "var(--fg-3)" }}>
            <div style={{ fontSize: 48, marginBottom: 16 }}>🏷️</div>

            <aside style={{ position: "sticky", top: 80, alignSelf: "flex-start", display: "flex", flexDirection: "column", gap: 20 }}>

// cart.jsx — Panel lateral del carrito de compras
// Props: cart, products, onClose, onQty, onCheckout, onShop

// ── Fila de producto dentro del carrito ─────────────────────────────────────
function CartLine({ line, onQty }) {
  const { p, q, id } = line;

  // Normaliza stock: soporta número (API) o strings legacy ("ok"/"low")
  const stockNum =
    typeof p.stock === "number" ? p.stock :
    p.stock === "ok"  ? 999 :
    p.stock === "low" ? (p.stockN || 3) : 0;

  const atMax = stockNum > 0 && q >= stockNum;

  return (
    <div style={{
      display: "flex", gap: 12, padding: 12,
      background: "var(--surface-2)",
      border: "1px solid var(--border)",
      borderRadius: 10,
      transition: "border-color .15s",
    }}>

      {/* Imagen */}
      <div style={{
        width: 72, height: 72, flexShrink: 0,
        background: "linear-gradient(180deg, #0c0c0f, #050506)",
        border: "1px solid var(--border-subtle)",
        borderRadius: 8,
        display: "flex", alignItems: "center", justifyContent: "center",
      }}>
        <ProductImg shape={p.shape} size={64} imageUrl={p.imageUrl}/>
      </div>

      {/* Info */}
      <div style={{ flex: 1, display: "flex", flexDirection: "column", gap: 5, minWidth: 0 }}>
        <div style={{
          font: "600 13px/1.3 var(--font-sans)",
          overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
          color: "var(--fg)",
        }}>
          {p.name}
        </div>
        <div style={{ font: "400 11px/1 var(--font-sans)", color: "var(--fg-3)" }}>
          {p.brand ? `${p.brand} · ` : ""}{p.subcat}
        </div>

        {/* Aviso stock máximo */}
        {atMax && (
          <div style={{ font: "500 10px/1 var(--font-mono)", color: "var(--warning)", letterSpacing: ".04em" }}>
            ⚠ Máx. disponible: {stockNum}
          </div>
        )}

        {/* Controles de cantidad + precio */}
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: "auto" }}>

          {/* Qty */}
          <div style={{
            display: "flex", alignItems: "center",
            border: "1px solid var(--border)", borderRadius: 7,
            height: 28, overflow: "hidden",
          }}>
            <button
              onClick={() => onQty(id, q - 1)}
              style={{
                width: 28, height: "100%", background: "transparent", border: 0,
                color: "var(--fg-2)", cursor: "pointer",
                display: "flex", alignItems: "center", justifyContent: "center",
                transition: "background .12s",
              }}
              onMouseEnter={e => e.currentTarget.style.background = "var(--surface)"}
              onMouseLeave={e => e.currentTarget.style.background = "transparent"}
            >
              <Icon name="minus" size={11}/>
            </button>

            <span style={{
              width: 28, textAlign: "center",
              font: "700 13px/1 var(--font-mono)", color: "var(--fg)",
              borderInline: "1px solid var(--border)",
              lineHeight: "28px",
            }}>
              {q}
            </span>

            <button
              onClick={() => { if (!atMax) onQty(id, q + 1); }}
              style={{
                width: 28, height: "100%", background: "transparent", border: 0,
                color: atMax ? "var(--fg-4)" : "var(--fg-2)",
                cursor: atMax ? "not-allowed" : "pointer",
                display: "flex", alignItems: "center", justifyContent: "center",
                transition: "background .12s",
              }}
              onMouseEnter={e => { if (!atMax) e.currentTarget.style.background = "var(--surface)"; }}
              onMouseLeave={e => e.currentTarget.style.background = "transparent"}
            >
              <Icon name="plus" size={11}/>
            </button>
          </div>

          {/* Precio línea */}
          <span style={{ font: "700 14px/1 var(--font-sans)", color: "var(--fg)" }}>
            ${((p.price || 0) * q).toLocaleString("en-US")}

      </div>

      {/* Botón eliminar */}
      <button
        onClick={() => onQty(id, 0)}

        onMouseEnter={e => e.currentTarget.style.color = "var(--brand-red)"}

        <Icon name="trash" size={14}/>
      </button>
    </div>
  );
}

// ── Panel principal del carrito ──────────────────────────────────────────────
function CartSheet({ cart, products, onClose, onQty, onCheckout, onShop }) {

  const lines = (cart || [])
    .map(i => ({ ...i, p: products.find(p => p.id === i.id) }))
    .filter(l => l.p);

  const subtotal   = lines.reduce((s, l) => s + (l.p.price || 0) * l.q, 0);
  const shipping   = subtotal > 0 && subtotal < 999 ? 99 : 0;
  const total      = subtotal + shipping;
  const itemCount  = lines.reduce((n, l) => n + l.q, 0);
  const remaining  = Math.max(0, 999 - subtotal);
  const progress   = Math.min((subtotal / 999) * 100, 100);

  return (
    <>
      {/* Backdrop */}
      <div className="lt-backdrop" onClick={onClose}/>

      {/* Panel */}
      <aside className="lt-sheet" style={{ background: "#09090c" }}>

        {/* ── Header ───────────────────────────────────────────────────── */}

          padding: "18px 20px",
          borderBottom: "1px solid var(--border)",
          display: "flex", alignItems: "center", justifyContent: "space-between",
          flexShrink: 0,
        }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>

              width: 36, height: 36, borderRadius: 10,
              background: "rgb(239 43 43 / 0.12)",
              color: "var(--brand-red)",
              display: "flex", alignItems: "center", justifyContent: "center",
            }}>
              <Icon name="cart" size={17}/>
            </div>
            <div>
              <div style={{ font: "700 16px/1 var(--font-sans)", letterSpacing: "-0.01em" }}>

                <div style={{ font: "400 11px/1 var(--font-mono)", color: "var(--fg-3)", marginTop: 3 }}>
                  {itemCount} {itemCount === 1 ? "artículo" : "artículos"}
                </div>
              )}
            </div>
          </div>

          <button className="lt-icon-btn" onClick={onClose}>
            <Icon name="close" size={16}/>
          </button>
        </div>

        {/* ── Contenido ────────────────────────────────────────────────── */}
        {lines.length === 0 ? (
          <CartEmpty onClose={onClose} onShop={onShop}/>
        ) : (
          <div style={{
            flex: 1, overflowY: "auto",
            padding: "12px 16px",
            display: "flex", flexDirection: "column", gap: 8,
          }}>
            {lines.map(l => <CartLine key={l.id} line={l} onQty={onQty}/>)}

            {/* Barra de progreso hacia envío gratis */}
            {remaining > 0 && (
              <div style={{
                padding: "12px 14px",
                background: "var(--surface)",
                border: "1px solid var(--border)",
                borderRadius: 10, marginTop: 4,
              }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
                  <span style={{ font: "500 12px/1 var(--font-sans)", color: "var(--fg-3)" }}>
                    Envío gratis a partir de
                  </span>
                  <span style={{ font: "600 12px/1 var(--font-mono)", color: "var(--neon-lime)" }}>$999</span>
                </div>
                <div style={{ height: 5, background: "var(--surface-2)", borderRadius: 999, overflow: "hidden" }}>
                  <div style={{
                    height: "100%", width: `${progress}%`,
                    background: "linear-gradient(90deg, var(--brand-red), var(--neon-lime))",
                    borderRadius: 999, transition: "width .4s ease",
                  }}/>
                </div>
                <div style={{ marginTop: 6, font: "400 11px/1 var(--font-mono)", color: "var(--fg-4)" }}>
                  Te faltan <strong style={{ color: "var(--fg-2)" }}>${remaining.toLocaleString("en-US")}</strong> para envío gratis 🚚
                </div>
              </div>
            )}
            {remaining === 0 && subtotal > 0 && (
              <div style={{
                display: "flex", alignItems: "center", gap: 8,
                padding: "10px 14px", borderRadius: 10,
                background: "rgb(182 255 60 / 0.08)",
                border: "1px solid rgb(182 255 60 / 0.25)",

// ── Formulario de nueva dirección ─────────────────────────────────────────────
function AddressForm({ onSave, onCancel }) {

}

// ── Vista previa de tarjeta ───────────────────────────────────────────────────

  const digits = (number || "").replace(/\s/g, "");
  const brand =
    digits.startsWith("4") ? "VISA" :
    digits.startsWith("51") || digits.startsWith("52") ||
    digits.startsWith("53") || digits.startsWith("54") ||
    digits.startsWith("55") ? "MASTERCARD" :
    digits.startsWith("3") ? "AMEX" : "";

  const gradients = {
    VISA:       "linear-gradient(135deg, #1a1a3e 0%, #0f1e6b 100%)",
    MASTERCARD: "linear-gradient(135deg, #1a0a00 0%, #7b1c00 100%)",
    AMEX:       "linear-gradient(135deg, #003a1e 0%, #006c38 100%)",

  return (
    <div style={{
      width: "100%", height: 156, borderRadius: 14,

      display: "flex", flexDirection: "column", justifyContent: "space-between",
      position: "relative", overflow: "hidden",

      {/* Glow orb */}
      <div style={{
        position: "absolute", right: -30, top: -30,
        width: 140, height: 140, borderRadius: "50%",
        background: brand === "VISA" ? "rgba(34,211,238,0.12)" :
                    brand === "MASTERCARD" ? "rgba(239,68,68,0.18)" :
                    brand === "AMEX" ? "rgba(34,197,94,0.14)" : "rgba(99,102,241,0.1)",
        pointerEvents: "none",
      }}/>
      <div style={{
        position: "absolute", left: -40, bottom: -40,
        width: 130, height: 130, borderRadius: "50%",
        background: "rgba(255,255,255,0.03)",
        pointerEvents: "none",
      }}/>

      {/* Fila superior: chip + marca */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", position: "relative" }}>
        <div style={{
          width: 36, height: 26, borderRadius: 4,
          background: "linear-gradient(135deg, #f59e0b, #d97706)",

      {/* Número */}
      <div style={{
        font: "500 17px/1 var(--font-mono)", letterSpacing: ".2em",
        color: number ? "rgba(255,255,255,0.95)" : "rgba(255,255,255,0.2)",

        {number || "•••• •••• •••• ••••"}

      {/* Fila inferior: titular + vencimiento */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", position: "relative" }}>
        <div>
          <div style={{ font: "400 8px/1 var(--font-sans)", color: "rgba(255,255,255,0.4)", letterSpacing: ".12em", marginBottom: 4 }}>
