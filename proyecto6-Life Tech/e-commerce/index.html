  <script type="text/babel">
// Offers / deals listing screen

// Un producto tiene oferta si cumple alguna de estas condiciones:
function isOffer(p) {
  if (p.inOferta === true)             return true;
  if (p.was && p.was > p.price)        return true;
  if (p.save && p.save > 0)            return true;
  if ((p.badges || []).some(b => b.startsWith("−"))) return true;
  return false;
}

// Calcula el % de descuento de un producto
function discountPct(p) {
  if (p.save) return p.save;
  if (p.was && p.was > p.price) return Math.round((1 - p.price / p.was) * 100);
  const badge = (p.badges || []).find(b => b.startsWith("−"));
  if (badge) return parseInt(badge.replace("−", "").replace("%", ""), 10) || 0;
  return 0;
}

// Ahorro en pesos
function savings(p) {
  if (p.was && p.was > p.price) return p.was - p.price;
  if (p.save && p.was)          return p.was - p.price;
  return 0;
}

const CAT_LABELS = { all: "Todas", perif: "Periféricos", comp: "Componentes", setup: "Setups" };

// ── Tarjeta de oferta con el descuento muy visible ───────────────────────────
function OfferCard({ product, onAdd, onOpen, fav, onFav }) {
  const pct  = discountPct(product);
  const save = savings(product);
  const isOut = product.stock === 0 || product.stock === "out";

  return (
    <div style={{
      position: "relative",
      background: "var(--surface)", border: "1px solid var(--border)",
      borderRadius: 14, overflow: "hidden",
      display: "flex", flexDirection: "column",
      transition: "all .22s var(--ease-out)",
    }}
    onMouseEnter={e => { e.currentTarget.style.borderColor = "var(--brand-red)"; e.currentTarget.style.boxShadow = "var(--shadow-glow-red)"; }}
    onMouseLeave={e => { e.currentTarget.style.borderColor = "var(--border)";    e.currentTarget.style.boxShadow = "none"; }}>

      {/* Badge de descuento — esquina superior izquierda */}
      {pct > 0 && (
        <div style={{
          position: "absolute", top: 10, left: 10, zIndex: 2,
          background: "var(--brand-red)", color: "#fff",
          font: "800 14px/1 var(--font-display)", padding: "5px 10px", borderRadius: 8,
          letterSpacing: "-0.02em",
        }}>
          −{pct}%
        </div>
      )}

      {/* Fav */}
      <button
        onClick={e => { e.stopPropagation(); onFav(product); }}
        style={{ position: "absolute", top: 10, right: 10, zIndex: 2, background: "var(--surface-2)", border: "1px solid var(--border)", borderRadius: 8, width: 32, height: 32, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}>
        <Icon name="heart" size={14} fill={fav} style={fav ? { color: "var(--brand-red)" } : {}}/>
      </button>

      {/* Imagen */}
      <div
        onClick={() => onOpen(product)}
        style={{ cursor: "pointer", padding: "32px 24px 16px", background: "linear-gradient(180deg,#0c0c0f 0%,#050506 100%)", display: "flex", alignItems: "center", justifyContent: "center", minHeight: 160 }}>
        <ProductImg shape={product.shape} size={120} imageUrl={product.imageUrl}/>
      </div>

      {/* Info */}
      <div style={{ padding: "14px 16px 16px", display: "flex", flexDirection: "column", gap: 8, flex: 1 }}>
        <div style={{ font: "600 11px/1 var(--font-sans)", color: "var(--fg-3)", textTransform: "uppercase", letterSpacing: ".08em" }}>
          {product.brand} · {CAT_LABELS[product.cat] || product.cat}
        </div>

        <div onClick={() => onOpen(product)}
          style={{ font: "700 15px/1.2 var(--font-sans)", cursor: "pointer", letterSpacing: "-0.02em" }}>
          {product.name}
        </div>

        {/* Precios */}
        <div style={{ display: "flex", alignItems: "baseline", gap: 8, flexWrap: "wrap" }}>
          <span style={{ font: "800 20px/1 var(--font-display)", letterSpacing: "-0.03em" }}>
            ${product.price.toLocaleString("en-US")}
          </span>
          {product.was && (
            <span style={{ font: "400 13px/1 var(--font-sans)", color: "var(--fg-3)", textDecoration: "line-through" }}>
              ${product.was.toLocaleString("en-US")}
            </span>
          )}
        </div>

        {/* Ahorro destacado */}
        {save > 0 && (
          <div style={{ font: "600 12px/1 var(--font-sans)", color: "var(--brand-red)" }}>
            Ahorras ${save.toLocaleString("en-US")} USD
          </div>
        )}

        {/* Stock */}
        <div style={{ fontSize: 11, color: "var(--fg-3)", marginTop: 2 }}>
          {isOut
            ? <span style={{ color: "var(--fg-3)" }}>Agotado</span>
            : product.stock === "low"
              ? <span style={{ color: "#f59e0b" }}>⚠ Quedan solo {product.stockN}</span>
              : <><span className="lt-live"/>&nbsp;En stock · envío 24h</>}
        </div>

        {/* CTA */}
        <button
          disabled={isOut}
          onClick={() => onAdd(product, 1)}
          style={{
            marginTop: 6, height: 38, borderRadius: 8, border: 0, cursor: isOut ? "not-allowed" : "pointer",
            background: isOut ? "var(--surface-2)" : "var(--brand-red)", color: isOut ? "var(--fg-3)" : "#fff",
            font: "700 13px/1 var(--font-sans)", transition: "opacity .18s",
            opacity: isOut ? 0.5 : 1,
          }}
          onMouseEnter={e => { if (!isOut) e.currentTarget.style.opacity = ".85"; }}
          onMouseLeave={e => { e.currentTarget.style.opacity = "1"; }}>
          {isOut ? "Agotado" : "Añadir al carrito"}
        </button>
      </div>
    </div>
  );
}

// ── Pantalla principal de ofertas ─────────────────────────────────────────────
function OffersScreen({ products, onAdd, onOpen, favs, onFav }) {
  const { useState } = React;

  const [filterCat,   setFilterCat]   = useState("all");
  const [filterBrand, setFilterBrand] = useState([]);
  const [sort,        setSort]        = useState("pct");   // pct | low | high | new

  // Solo productos con oferta
  const offerProds = (products || []).filter(isOffer);

  // Categorías presentes en las ofertas (con conteo)
  const catsInOffers = ["all", "perif", "comp", "setup"].filter(id =>
    id === "all" || offerProds.some(p => p.cat === id)
  );

  // Marcas presentes en las ofertas del cat seleccionado
  const brandsInOffers = [...new Set(
    offerProds.filter(p => filterCat === "all" || p.cat === filterCat).map(p => p.brand).filter(Boolean)
  )].sort();

  const toggleBrand = (b) => setFilterBrand(prev => {
    const s = new Set(prev);
    s.has(b) ? s.delete(b) : s.add(b);
    return Array.from(s);
  });

  // Filtrado + ordenamiento
  const list = offerProds
    .filter(p => {
      if (filterCat !== "all" && p.cat !== filterCat) return false;
      if (filterBrand.length > 0 && !filterBrand.includes(p.brand)) return false;
      return true;
    })
    .sort((a, b) => {
      if (sort === "pct")  return discountPct(b) - discountPct(a);
      if (sort === "low")  return (a.price || 0) - (b.price || 0);
      if (sort === "high") return (b.price || 0) - (a.price || 0);
      if (sort === "new") {
        return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
      }
      return 0;
    });

  // Descuento máximo y ahorro total posible (para el hero)
  const maxPct   = offerProds.reduce((m, p) => Math.max(m, discountPct(p)), 0);
  const totalSave = list.reduce((s, p) => s + savings(p), 0);

  return (
    <section className="lt-section" style={{ paddingTop: 0 }}>

      {/* ── Hero banner ── */}
      <div className="lt-offers-hero">
        <div className="lt-offers-hero-inner">

            <span className="lt-live"/> Ofertas activas ahora
          </div>

            Hasta <span style={{ color: "var(--brand-red)" }}>−{maxPct}%</span><br/>de descuento
          </h1>
          <p style={{ font: "400 17px/1.5 var(--font-sans)", color: "var(--fg-2)", marginTop: 16, maxWidth: 520 }}>
            Precios rebajados en periféricos, componentes y setups completos. Stock limitado.
          </p>
          <div className="lt-offers-kpi">
            <div>
              <div className="lt-offers-kpi-val">{offerProds.length}</div>
              <div className="lt-offers-kpi-lbl">productos en oferta</div>
            </div>
            {totalSave > 0 && (
              <div>
                <div className="lt-offers-kpi-val" style={{ color: "var(--fg)" }}>${totalSave.toLocaleString("en-US")}</div>
                <div className="lt-offers-kpi-lbl">en ahorros (vista actual)</div>
              </div>
            )}
            <div>
              <div className="lt-offers-kpi-val">{maxPct}%</div>
              <div className="lt-offers-kpi-lbl">descuento máximo</div>
            </div>
          </div>
        </div>
      </div>

      {/* ── Contenido principal ── */}
      <div className="lt-section-inner" style={{ paddingTop: 36, paddingBottom: 64 }}>

        {/* ── Filtros de categoría (pills) ── */}
        <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", marginBottom: 28 }}>
          {catsInOffers.map(id => {
            const count = id === "all" ? offerProds.length : offerProds.filter(p => p.cat === id).length;
            const active = filterCat === id;
            return (
              <button key={id} onClick={() => { setFilterCat(id); setFilterBrand([]); }}
                style={{
                  height: 36, padding: "0 16px", borderRadius: 999, cursor: "pointer",
                  font: "600 13px/1 var(--font-sans)",
                  border: `1px solid ${active ? "var(--brand-red)" : "var(--border)"}`,
                  background: active ? "var(--brand-red)" : "var(--surface)",
                  color: active ? "#fff" : "var(--fg-2)",
                  transition: "all .18s var(--ease-out)",
                }}>
                {CAT_LABELS[id]} <span style={{ opacity: 0.75, fontSize: 11, marginLeft: 4 }}>({count})</span>
              </button>
            );

        </div>

        {offerProds.length === 0 ? (
          /* Estado vacío global */
          <div style={{ padding: "80px 0", textAlign: "center", color: "var(--fg-3)" }}>
            <div style={{ fontSize: 48, marginBottom: 16 }}>🏷️</div>

            <aside style={{ position: "sticky", top: 80, alignSelf: "flex-start", display: "flex", flexDirection: "column", gap: 20 }}>

// cart.jsx — Panel lateral del carrito de compras
// Props: cart, products, onClose, onQty, onCheckout, onShop

// ── Fila de producto dentro del carrito ─────────────────────────────────────
function CartLine({ line, onQty }) {
  const { p, q, id } = line;

  // Normaliza stock: soporta número (API) o strings legacy ("ok"/"low")
  const stockNum =
    typeof p.stock === "number" ? p.stock :
    p.stock === "ok"  ? 999 :
    p.stock === "low" ? (p.stockN || 3) : 0;

  const atMax = stockNum > 0 && q >= stockNum;

  return (
    <div style={{
      display: "flex", gap: 12, padding: 12,
      background: "var(--surface-2)",
      border: "1px solid var(--border)",
      borderRadius: 10,
      transition: "border-color .15s",
    }}>

      {/* Imagen */}
      <div style={{
        width: 72, height: 72, flexShrink: 0,
        background: "linear-gradient(180deg, #0c0c0f, #050506)",
        border: "1px solid var(--border-subtle)",
        borderRadius: 8,
        display: "flex", alignItems: "center", justifyContent: "center",
      }}>
        <ProductImg shape={p.shape} size={64} imageUrl={p.imageUrl}/>
      </div>

      {/* Info */}
      <div style={{ flex: 1, display: "flex", flexDirection: "column", gap: 5, minWidth: 0 }}>
        <div style={{
          font: "600 13px/1.3 var(--font-sans)",
          overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
          color: "var(--fg)",
        }}>
          {p.name}
        </div>
        <div style={{ font: "400 11px/1 var(--font-sans)", color: "var(--fg-3)" }}>
          {p.brand ? `${p.brand} · ` : ""}{p.subcat}
        </div>

        {/* Aviso stock máximo */}
        {atMax && (
          <div style={{ font: "500 10px/1 var(--font-mono)", color: "var(--warning)", letterSpacing: ".04em" }}>
            ⚠ Máx. disponible: {stockNum}
          </div>
        )}

        {/* Controles de cantidad + precio */}
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: "auto" }}>

          {/* Qty */}
          <div style={{
            display: "flex", alignItems: "center",
            border: "1px solid var(--border)", borderRadius: 7,
            height: 28, overflow: "hidden",
          }}>
            <button
              onClick={() => onQty(id, q - 1)}
              style={{
                width: 28, height: "100%", background: "transparent", border: 0,
                color: "var(--fg-2)", cursor: "pointer",
                display: "flex", alignItems: "center", justifyContent: "center",
                transition: "background .12s",
              }}
              onMouseEnter={e => e.currentTarget.style.background = "var(--surface)"}
              onMouseLeave={e => e.currentTarget.style.background = "transparent"}
            >
              <Icon name="minus" size={11}/>
            </button>

            <span style={{
              width: 28, textAlign: "center",
              font: "700 13px/1 var(--font-mono)", color: "var(--fg)",
              borderInline: "1px solid var(--border)",
              lineHeight: "28px",
            }}>
              {q}
            </span>

            <button
              onClick={() => { if (!atMax) onQty(id, q + 1); }}
              style={{
                width: 28, height: "100%", background: "transparent", border: 0,
                color: atMax ? "var(--fg-4)" : "var(--fg-2)",
                cursor: atMax ? "not-allowed" : "pointer",
                display: "flex", alignItems: "center", justifyContent: "center",
                transition: "background .12s",
              }}
              onMouseEnter={e => { if (!atMax) e.currentTarget.style.background = "var(--surface)"; }}
              onMouseLeave={e => e.currentTarget.style.background = "transparent"}
            >
              <Icon name="plus" size={11}/>
            </button>
          </div>

          {/* Precio línea */}
          <span style={{ font: "700 14px/1 var(--font-sans)", color: "var(--fg)" }}>
            ${((p.price || 0) * q).toLocaleString("en-US")}

      </div>

      {/* Botón eliminar */}
      <button
        onClick={() => onQty(id, 0)}

        onMouseEnter={e => e.currentTarget.style.color = "var(--brand-red)"}

        <Icon name="trash" size={14}/>
      </button>
    </div>
  );
}

// ── Panel principal del carrito ──────────────────────────────────────────────
function CartSheet({ cart, products, onClose, onQty, onCheckout, onShop }) {

  const lines = (cart || [])
    .map(i => ({ ...i, p: products.find(p => p.id === i.id) }))
    .filter(l => l.p);

  const subtotal   = lines.reduce((s, l) => s + (l.p.price || 0) * l.q, 0);
  const shipping   = subtotal > 0 && subtotal < 999 ? 99 : 0;
  const total      = subtotal + shipping;
  const itemCount  = lines.reduce((n, l) => n + l.q, 0);
  const remaining  = Math.max(0, 999 - subtotal);
  const progress   = Math.min((subtotal / 999) * 100, 100);

  return (
    <>
      {/* Backdrop */}
      <div className="lt-backdrop" onClick={onClose}/>

      {/* Panel */}
      <aside className="lt-sheet" style={{ background: "#09090c" }}>

        {/* ── Header ───────────────────────────────────────────────────── */}

          padding: "18px 20px",
          borderBottom: "1px solid var(--border)",
          display: "flex", alignItems: "center", justifyContent: "space-between",
          flexShrink: 0,
        }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>

              width: 36, height: 36, borderRadius: 10,
              background: "rgb(239 43 43 / 0.12)",
              color: "var(--brand-red)",
              display: "flex", alignItems: "center", justifyContent: "center",
            }}>
              <Icon name="cart" size={17}/>
            </div>
            <div>
              <div style={{ font: "700 16px/1 var(--font-sans)", letterSpacing: "-0.01em" }}>

                <div style={{ font: "400 11px/1 var(--font-mono)", color: "var(--fg-3)", marginTop: 3 }}>
                  {itemCount} {itemCount === 1 ? "artículo" : "artículos"}
                </div>
              )}
            </div>
          </div>

          <button className="lt-icon-btn" onClick={onClose}>
            <Icon name="close" size={16}/>
          </button>
        </div>

        {/* ── Contenido ────────────────────────────────────────────────── */}
        {lines.length === 0 ? (
          <CartEmpty onClose={onClose} onShop={onShop}/>
        ) : (
          <div style={{
            flex: 1, overflowY: "auto",
            padding: "12px 16px",
            display: "flex", flexDirection: "column", gap: 8,
          }}>
            {lines.map(l => <CartLine key={l.id} line={l} onQty={onQty}/>)}

            {/* Barra de progreso hacia envío gratis */}
            {remaining > 0 && (
              <div style={{
                padding: "12px 14px",
                background: "var(--surface)",
                border: "1px solid var(--border)",
                borderRadius: 10, marginTop: 4,
              }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
                  <span style={{ font: "500 12px/1 var(--font-sans)", color: "var(--fg-3)" }}>
                    Envío gratis a partir de
                  </span>
                  <span style={{ font: "600 12px/1 var(--font-mono)", color: "var(--neon-lime)" }}>$999</span>
                </div>
                <div style={{ height: 5, background: "var(--surface-2)", borderRadius: 999, overflow: "hidden" }}>
                  <div style={{
                    height: "100%", width: `${progress}%`,
                    background: "linear-gradient(90deg, var(--brand-red), var(--neon-lime))",
                    borderRadius: 999, transition: "width .4s ease",
                  }}/>
                </div>
                <div style={{ marginTop: 6, font: "400 11px/1 var(--font-mono)", color: "var(--fg-4)" }}>
                  Te faltan <strong style={{ color: "var(--fg-2)" }}>${remaining.toLocaleString("en-US")}</strong> para envío gratis 🚚
                </div>
              </div>
            )}
            {remaining === 0 && subtotal > 0 && (
              <div style={{
                display: "flex", alignItems: "center", gap: 8,
                padding: "10px 14px", borderRadius: 10,
                background: "rgb(182 255 60 / 0.08)",
                border: "1px solid rgb(182 255 60 / 0.25)",

// ── Formulario de nueva dirección ─────────────────────────────────────────────
function AddressForm({ onSave, onCancel }) {

}

// ── Vista previa de tarjeta ───────────────────────────────────────────────────

  const digits = (number || "").replace(/\s/g, "");
  const brand =
    digits.startsWith("4") ? "VISA" :
    digits.startsWith("51") || digits.startsWith("52") ||
    digits.startsWith("53") || digits.startsWith("54") ||
    digits.startsWith("55") ? "MASTERCARD" :
    digits.startsWith("3") ? "AMEX" : "";

  const gradients = {
    VISA:       "linear-gradient(135deg, #1a1a3e 0%, #0f1e6b 100%)",
    MASTERCARD: "linear-gradient(135deg, #1a0a00 0%, #7b1c00 100%)",
    AMEX:       "linear-gradient(135deg, #003a1e 0%, #006c38 100%)",

  return (
    <div style={{
      width: "100%", height: 156, borderRadius: 14,

      display: "flex", flexDirection: "column", justifyContent: "space-between",
      position: "relative", overflow: "hidden",

      {/* Glow orb */}
      <div style={{
        position: "absolute", right: -30, top: -30,
        width: 140, height: 140, borderRadius: "50%",
        background: brand === "VISA" ? "rgba(34,211,238,0.12)" :
                    brand === "MASTERCARD" ? "rgba(239,68,68,0.18)" :
                    brand === "AMEX" ? "rgba(34,197,94,0.14)" : "rgba(99,102,241,0.1)",
        pointerEvents: "none",
      }}/>
      <div style={{
        position: "absolute", left: -40, bottom: -40,
        width: 130, height: 130, borderRadius: "50%",
        background: "rgba(255,255,255,0.03)",
        pointerEvents: "none",
      }}/>

      {/* Fila superior: chip + marca */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", position: "relative" }}>
        <div style={{
          width: 36, height: 26, borderRadius: 4,
          background: "linear-gradient(135deg, #f59e0b, #d97706)",

      {/* Número */}
      <div style={{
        font: "500 17px/1 var(--font-mono)", letterSpacing: ".2em",
        color: number ? "rgba(255,255,255,0.95)" : "rgba(255,255,255,0.2)",

        {number || "•••• •••• •••• ••••"}

      {/* Fila inferior: titular + vencimiento */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", position: "relative" }}>
        <div>
          <div style={{ font: "400 8px/1 var(--font-sans)", color: "rgba(255,255,255,0.4)", letterSpacing: ".12em", marginBottom: 4 }}>

}

// ── Formulario de nueva tarjeta ───────────────────────────────────────────────
function PaymentForm({ onSave, onCancel }) {
  const [form, setForm] = React.useState({ number: "", name: "", exp: "", cvv: "" });
  const [errors, setErrors] = React.useState({});

  const setField = (k, v) => {
    setForm(f => ({ ...f, [k]: v }));
    setErrors(e => ({ ...e, [k]: "" }));
  };

  const fmtNumber = v => {
    const d = v.replace(/\D/g, "").slice(0, 16);
    return d.replace(/(.{4})/g, "$1 ").trim();
  };

  const fmtExp = v => {
    const d = v.replace(/\D/g, "").slice(0, 4);
    if (d.length > 2) return `${d.slice(0, 2)}/${d.slice(2)}`;
    return d;
  };

  const detectBrand = n => {
    const d = n.replace(/\s/g, "");
    if (d.startsWith("4")) return "Visa";
    if (/^5[1-5]/.test(d)) return "Mastercard";
    if (d.startsWith("3")) return "Amex";
    return "Tarjeta";
  };

  const validate = () => {
    const e = {};
    if (form.number.replace(/\s/g, "").length < 16) e.number = "Número inválido (16 dígitos)";
    if (!form.name.trim())  e.name = "Campo requerido";
    if (form.exp.length < 5) e.exp  = "Fecha inválida (MM/AA)";
    if (form.cvv.length < 3) e.cvv  = "CVV inválido";
    return e;
  };

  const handleSave = () => {
    const e = validate();
    if (Object.keys(e).length > 0) { setErrors(e); return; }
    const digits = form.number.replace(/\s/g, "");
    onSave({
      id: Date.now(),
      brand: detectBrand(form.number),
      last4: digits.slice(-4),
      exp: form.exp,
      holderName: form.name,
      default: false,
    });
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14, animation: "lt-fade-in .2s ease" }}>

      {/* Vista previa */}
      <CardVisual number={form.number} name={form.name} exp={form.exp}/>

      <Field label="Número de tarjeta" error={errors.number}>
        <input
          className="lt-input"
          placeholder="1234 5678 9012 3456"
          value={form.number}
          maxLength={19}
          onChange={e => setField("number", fmtNumber(e.target.value))}
          style={{ fontFamily: "var(--font-mono)", letterSpacing: ".08em" }}
        />
      </Field>

      <Field label="Nombre en la tarjeta" error={errors.name}>
        <input
          className="lt-input"
          placeholder="JUAN GARCIA"
          value={form.name}
          onChange={e => setField("name", e.target.value.toUpperCase())}
          style={{ fontFamily: "var(--font-mono)", letterSpacing: ".06em" }}
        />
      </Field>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        <Field label="Vencimiento" error={errors.exp}>
          <input
            className="lt-input"
            placeholder="MM/AA"
            value={form.exp}
            maxLength={5}
            onChange={e => setField("exp", fmtExp(e.target.value))}
            style={{ fontFamily: "var(--font-mono)" }}
          />
        </Field>
        <Field label="CVV" error={errors.cvv}>
          <input
            className="lt-input"
            placeholder="•••"
            type="password"
            value={form.cvv}
            maxLength={4}
            onChange={e => setField("cvv", e.target.value.replace(/\D/g, "").slice(0, 4))}
            style={{ fontFamily: "var(--font-mono)" }}
          />
        </Field>
      </div>

      {/* Badge seguridad */}
      <div style={{
        display: "flex", alignItems: "center", gap: 8,
        padding: "10px 12px", borderRadius: 8,
        background: "rgb(182 255 60 / 0.06)",
        border: "1px solid rgb(182 255 60 / 0.2)",
      }}>
        <Icon name="shield" size={14} style={{ color: "var(--neon-lime)", flexShrink: 0 }}/>
        <span style={{ font: "400 11px/1.4 var(--font-sans)", color: "var(--fg-3)" }}>
          Tus datos van cifrados con TLS 256-bit. El CVV nunca se almacena.
        </span>
      </div>

      <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
        <button
          onClick={handleSave}
          className="lt-btn lt-btn--primary lt-btn--block"
        >
          Añadir tarjeta <Icon name="check" size={15}/>
        </button>
        <button
          onClick={onCancel}
          className="lt-btn lt-btn--ghost"
          style={{ flexShrink: 0, padding: "0 18px" }}
        >
          Cancelar
        </button>
      </div>
    </div>
  );
}

// ── Pantalla principal de checkout ────────────────────────────────────────────
function CheckoutScreen({ cart, products, account, onBack, onComplete }) {
  const [step, setStep] = React.useState(1);

  // Estado local de direcciones y tarjetas (arranca vacío)
  const [addresses,    setAddresses]    = React.useState([]);
  const [cards,        setCards]        = React.useState([]);
  const [selectedAddr, setSelectedAddr] = React.useState(null);
  const [selectedCard, setSelectedCard] = React.useState(null);

  // Control de formularios inline
  const [showAddrForm, setShowAddrForm] = React.useState(false);
  const [showCardForm, setShowCardForm] = React.useState(false);

  // Líneas del pedido
  const lines = (cart || [])
    .map(i => ({ ...i, p: products.find(p => p.id === i.id) }))
    .filter(l => l.p);

  const subtotal = lines.reduce((s, l) => s + (l.p.price || 0) * l.q, 0);
  const shipping = subtotal >= 999 ? 0 : 99;
  const tax      = Math.round(subtotal * 0.19);
  const total    = subtotal + shipping + tax;

  const addAddress = (addr) => {
    const isFirst = addresses.length === 0;
    setAddresses(a => [...a, { ...addr, default: isFirst }]);
    if (isFirst) setSelectedAddr(addr.id);
    setShowAddrForm(false);
  };

  const addCard = (card) => {
    const isFirst = cards.length === 0;
    setCards(c => [...c, { ...card, default: isFirst }]);
    if (isFirst) setSelectedCard(card.id);
    setShowCardForm(false);
  };

  // Validación de pasos
  const canContinue =
    (step === 1 && selectedAddr !== null) ||
    (step === 2 && selectedCard !== null) ||
    step === 3;

  const handleContinue = () => {
    if (canContinue) setStep(s => s + 1);
  };

  return (
    <section className="lt-section" style={{ paddingTop: 32 }}>
      <div className="lt-section-inner">

        {/* Back */}
        <a onClick={onBack} style={{ display: "inline-flex", alignItems: "center", gap: 6, color: "var(--fg-3)", fontSize: 13, cursor: "pointer", marginBottom: 24 }}>
          <Icon name="arrowL" size={14}/> Seguir comprando
        </a>

        <h1 style={{ font: "900 44px/1 var(--font-display)", letterSpacing: "-0.04em", marginBottom: 8 }}>Checkout</h1>
        <p style={{ color: "var(--fg-2)", marginBottom: 32 }}>Tres pasos. Sin sorpresas.</p>

        {/* Stepper */}
        <div style={{ display: "flex", gap: 12, marginBottom: 32 }}>
          {["Envío", "Pago", "Revisar"].map((s, i) => (
            <div key={s} style={{
              flex: 1, padding: "12px 16px",
              border: `1px solid ${step >= i + 1 ? "var(--brand-red)" : "var(--border)"}`,
              borderRadius: 10,
              display: "flex", alignItems: "center", gap: 10,
              background: step === i + 1 ? "rgb(239 43 43 / 0.08)" : "transparent",
              transition: "all .2s",
            }}>
              <span style={{
                width: 24, height: 24, borderRadius: 999, flexShrink: 0,
                background: step >= i + 1 ? "var(--brand-red)" : "var(--surface-2)",
                color: step >= i + 1 ? "#fff" : "var(--fg-3)",
                display: "flex", alignItems: "center", justifyContent: "center",
                fontSize: 12, fontWeight: 700,
              }}>
                {step > i + 1 ? <Icon name="check" size={12}/> : i + 1}
              </span>
              <span style={{ font: "600 13px/1 var(--font-sans)", color: step >= i + 1 ? "var(--fg)" : "var(--fg-3)" }}>
                {s}
              </span>
            </div>
          ))}
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1.4fr 1fr", gap: 32, alignItems: "flex-start" }}>
          <div style={{ display: "flex", flexDirection: "column", gap: 24 }}>

            {/* ── PASO 1: DIRECCIÓN ─────────────────────────────────── */}
            {step === 1 && (
              <CheckoutCard title="Dirección de envío">

                {/* Lista de direcciones guardadas */}
                {addresses.length > 0 && !showAddrForm && (
                  <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
                    {addresses.map(a => {
                      const sel = selectedAddr === a.id;
                      return (
                        <div
                          key={a.id}
                          onClick={() => setSelectedAddr(a.id)}
                          style={{
                            display: "flex", alignItems: "flex-start", gap: 12,
                            padding: 14, borderRadius: 10, cursor: "pointer",
                            border: `1px solid ${sel ? "var(--brand-red)" : "var(--border)"}`,
                            background: sel ? "rgb(239 43 43 / 0.06)" : "var(--surface-2)",
                            transition: "all .15s",
                          }}
                        >
                          {/* Radio */}
                          <span style={{
                            width: 18, height: 18, borderRadius: 999, marginTop: 1, flexShrink: 0,
                            border: `2px solid ${sel ? "var(--brand-red)" : "var(--border-strong)"}`,
                            display: "flex", alignItems: "center", justifyContent: "center",
                          }}>
                            {sel && <span style={{ width: 8, height: 8, borderRadius: 999, background: "var(--brand-red)" }}/>}
                          </span>
                          <div style={{ flex: 1 }}>
                            <div style={{ font: "600 13px/1.2 var(--font-sans)", color: "var(--fg)" }}>
                              {a.label}
                              {a.default && (
                                <span className="lt-overline" style={{ color: "var(--brand-red)", marginLeft: 8 }}>Predeterminada</span>
                              )}
                            </div>
                            <div style={{ color: "var(--fg-2)", fontSize: 13, marginTop: 3 }}>{a.line1}</div>
                            <div style={{ color: "var(--fg-3)", fontSize: 12, marginTop: 2 }}>
                              {a.city}, {a.state} · CP {a.zip} · {a.country}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}

                {/* Estado vacío — ninguna dirección */}
                {addresses.length === 0 && !showAddrForm && (
                  <div style={{
                    padding: "28px 20px", textAlign: "center",
                    border: "1px dashed var(--border)", borderRadius: 10,
                    background: "var(--surface-2)", marginBottom: 16,
                  }}>
                    <Icon name="mapPin" size={28} style={{ color: "var(--fg-4)", marginBottom: 10 }}/>
                    <div style={{ font: "600 14px/1 var(--font-sans)", color: "var(--fg-2)", marginBottom: 6 }}>
                      No tienes direcciones guardadas
                    </div>
                    <div style={{ font: "400 12px/1.4 var(--font-sans)", color: "var(--fg-4)" }}>
                      Añade una dirección para continuar con tu pedido.
                    </div>
                  </div>
                )}

                {/* Formulario inline */}
                {showAddrForm && (
                  <div style={{ marginBottom: 8 }}>
                    <AddressForm
                      onSave={addAddress}
                      onCancel={() => setShowAddrForm(false)}
                    />
                  </div>
                )}

                {/* Botón añadir */}
                {!showAddrForm && (
                  <button
                    onClick={() => setShowAddrForm(true)}
                    style={{
                      display: "flex", alignItems: "center", gap: 7,
                      background: "none", border: "none",
                      color: "var(--brand-red)", font: "600 13px/1 var(--font-sans)",
                      cursor: "pointer", padding: "4px 0",
                      transition: "opacity .15s",
                    }}
                    onMouseEnter={e => e.currentTarget.style.opacity = "0.75"}
                    onMouseLeave={e => e.currentTarget.style.opacity = "1"}
                  >
                    <Icon name="plus" size={14}/>
                    Añadir {addresses.length > 0 ? "otra dirección" : "dirección"}
                  </button>
                )}
              </CheckoutCard>
            )}

            {/* ── PASO 2: PAGO ──────────────────────────────────────── */}
            {step === 2 && (
              <CheckoutCard title="Método de pago">

                {/* Lista de tarjetas guardadas */}
                {cards.length > 0 && !showCardForm && (
                  <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
                    {cards.map(c => {
                      const sel = selectedCard === c.id;
                      return (
                        <div
                          key={c.id}
                          onClick={() => setSelectedCard(c.id)}
                          style={{
                            display: "flex", alignItems: "center", gap: 12,
                            padding: 14, borderRadius: 10, cursor: "pointer",
                            border: `1px solid ${sel ? "var(--brand-red)" : "var(--border)"}`,
                            background: sel ? "rgb(239 43 43 / 0.06)" : "var(--surface-2)",
                            transition: "all .15s",
                          }}
                        >
                          {/* Radio */}
                          <span style={{
                            width: 18, height: 18, borderRadius: 999, flexShrink: 0,
                            border: `2px solid ${sel ? "var(--brand-red)" : "var(--border-strong)"}`,
                            display: "flex", alignItems: "center", justifyContent: "center",
                          }}>
                            {sel && <span style={{ width: 8, height: 8, borderRadius: 999, background: "var(--brand-red)" }}/>}
                          </span>
                          <Icon name="card" size={18} style={{ color: "var(--fg-3)" }}/>
                          <div style={{ flex: 1 }}>
                            <div style={{ font: "600 13px/1.2 var(--font-sans)" }}>
                              {c.brand} ···· {c.last4}
                            </div>
                            <div style={{ color: "var(--fg-3)", fontSize: 12, marginTop: 2 }}>
                              {c.holderName} · Vence {c.exp}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}

                {/* Estado vacío — ninguna tarjeta */}
                {cards.length === 0 && !showCardForm && (
                  <div style={{
                    padding: "28px 20px", textAlign: "center",
                    border: "1px dashed var(--border)", borderRadius: 10,
                    background: "var(--surface-2)", marginBottom: 16,
                  }}>
                    <Icon name="card" size={28} style={{ color: "var(--fg-4)", marginBottom: 10 }}/>
                    <div style={{ font: "600 14px/1 var(--font-sans)", color: "var(--fg-2)", marginBottom: 6 }}>
                      No tienes tarjetas guardadas
                    </div>
                    <div style={{ font: "400 12px/1.4 var(--font-sans)", color: "var(--fg-4)" }}>
                      Añade una tarjeta para completar tu compra.
                    </div>
                  </div>
                )}

                {/* Formulario inline */}
                {showCardForm && (
                  <div style={{ marginBottom: 8 }}>
                    <PaymentForm
                      onSave={addCard}
                      onCancel={() => setShowCardForm(false)}
                    />
                  </div>
                )}

                {/* Botón añadir tarjeta */}
                {!showCardForm && (
                  <button
                    onClick={() => setShowCardForm(true)}
                    style={{
                      display: "flex", alignItems: "center", gap: 7,
                      background: "none", border: "none",
                      color: "var(--brand-red)", font: "600 13px/1 var(--font-sans)",
                      cursor: "pointer", padding: "4px 0",
                      transition: "opacity .15s",
                    }}
                    onMouseEnter={e => e.currentTarget.style.opacity = "0.75"}
                    onMouseLeave={e => e.currentTarget.style.opacity = "1"}
                  >
                    <Icon name="plus" size={14}/>
                    {cards.length > 0 ? "Añadir otra tarjeta" : "Añadir tarjeta"}
                  </button>
                )}

                {/* Badge seguridad general */}
                {!showCardForm && (
                  <div style={{ marginTop: 16, padding: "10px 12px", background: "var(--surface-2)", border: "1px dashed var(--border)", borderRadius: 10, display: "flex", gap: 10, alignItems: "center" }}>
                    <Icon name="shield" size={16} style={{ color: "var(--neon-lime)", flexShrink: 0 }}/>
                    <div>
                      <div style={{ font: "600 12px/1.2 var(--font-sans)" }}>Pago protegido</div>
                      <div style={{ color: "var(--fg-3)", fontSize: 11, marginTop: 2 }}>Cifrado de extremo a extremo · Stripe</div>
                    </div>
                  </div>
                )}
              </CheckoutCard>
            )}

            {/* ── PASO 3: REVISAR ───────────────────────────────────── */}
            {step === 3 && (
              <CheckoutCard title="Revisar pedido">
                <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                  {lines.map(l => (
                    <div key={l.id} style={{ display: "flex", gap: 14, padding: 12, background: "var(--surface-2)", borderRadius: 10 }}>
                      <div style={{ width: 60, height: 60, background: "linear-gradient(180deg,#0c0c0f,#050506)", borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                        <ProductImg shape={l.p.shape} size={56} imageUrl={l.p.imageUrl}/>
                      </div>
                      <div style={{ flex: 1 }}>
                        <div style={{ font: "600 13px/1.2 var(--font-sans)" }}>{l.p.name}</div>
                        <div style={{ color: "var(--fg-3)", fontSize: 11, marginTop: 2 }}>{l.p.brand} · Cantidad: {l.q}</div>
                      </div>
                      <span style={{ font: "700 14px/1 var(--font-sans)", alignSelf: "center" }}>
                        ${((l.p.price || 0) * l.q).toLocaleString("en-US")}
                      </span>
                    </div>
                  ))}

                  {/* Resumen de envío y pago seleccionados */}
                  <div style={{ marginTop: 8, padding: "12px 14px", background: "var(--surface-2)", borderRadius: 10, display: "flex", flexDirection: "column", gap: 8 }}>
                    {selectedAddr !== null && (() => {
                      const a = addresses.find(x => x.id === selectedAddr);
                      return a ? (
                        <div style={{ display: "flex", gap: 8, alignItems: "flex-start" }}>
                          <Icon name="mapPin" size={14} style={{ color: "var(--fg-4)", marginTop: 1, flexShrink: 0 }}/>
                          <div>
                            <div style={{ font: "600 12px/1 var(--font-sans)", color: "var(--fg-2)", marginBottom: 2 }}>Envío a</div>
                            <div style={{ font: "400 12px/1.4 var(--font-sans)", color: "var(--fg-3)" }}>
                              {a.line1}, {a.city} · CP {a.zip}
                            </div>
                          </div>
                        </div>
                      ) : null;
                    })()}
                    {selectedCard !== null && (() => {
                      const c = cards.find(x => x.id === selectedCard);
                      return c ? (
                        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                          <Icon name="card" size={14} style={{ color: "var(--fg-4)", flexShrink: 0 }}/>
                          <div style={{ font: "400 12px/1 var(--font-sans)", color: "var(--fg-3)" }}>
                            {c.brand} ···· {c.last4} · Vence {c.exp}
                          </div>
                        </div>
                      ) : null;
                    })()}
                  </div>
                </div>
              </CheckoutCard>
            )}
          </div>

          {/* ── Resumen lateral ──────────────────────────────────────── */}
          <aside style={{
            position: "sticky", top: 80,
            background: "var(--surface)", border: "1px solid var(--border)",
            borderRadius: 12, padding: 20,
            display: "flex", flexDirection: "column", gap: 12,
          }}>
            <h4 style={{ font: "700 16px/1 var(--font-sans)", marginBottom: 4 }}>Resumen</h4>

            <Row k={`Subtotal (${lines.length})`} v={`$${subtotal.toLocaleString("en-US")}`}/>
            <Row k="Envío" v={shipping === 0
              ? <span style={{ color: "var(--neon-lime)" }}>Gratis 🚚</span>
              : `$${shipping.toLocaleString("en-US")}`}
            />
            <Row k="IVA (19%)" v={`$${tax.toLocaleString("en-US")}`}/>
            <hr style={{ border: 0, borderTop: "1px solid var(--border)", margin: "4px 0" }}/>

            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
              <span style={{ font: "600 14px/1 var(--font-sans)" }}>Total</span>
              <span style={{ font: "900 28px/1 var(--font-display)", letterSpacing: "-0.03em" }}>
                ${total.toLocaleString("en-US")}
              </span>
            </div>

            {/* Puntos */}
            <div style={{ display: "flex", gap: 8, padding: 10, background: "rgb(34 211 238 / 0.08)", border: "1px solid rgb(34 211 238 / 0.25)", borderRadius: 8 }}>
              <Icon name="ai" size={14} style={{ color: "var(--neon-cyan)", flexShrink: 0, marginTop: 1 }}/>
              <span style={{ fontSize: 12, color: "var(--fg-2)", lineHeight: 1.4 }}>
                Ganarás <span style={{ color: "var(--neon-cyan)", fontWeight: 600 }}>{Math.round(total / 10)} pts</span> con esta compra.
              </span>
            </div>

            {/* Botón continuar / pagar */}
            {step < 3 ? (
              <>
                <button
                  onClick={handleContinue}
                  disabled={!canContinue}
                  className="lt-btn lt-btn--primary lt-btn--lg lt-btn--block"
                  style={!canContinue ? { opacity: 0.4, cursor: "not-allowed", transform: "none", boxShadow: "none" } : {}}
                >
                  Continuar <Icon name="arrowR" size={16}/>
                </button>
                {!canContinue && (
                  <p style={{ font: "400 11px/1.4 var(--font-sans)", color: "var(--fg-4)", textAlign: "center", margin: "0" }}>
                    {step === 1 ? "Añade y selecciona una dirección para continuar" : "Añade y selecciona una tarjeta para continuar"}
                  </p>
                )}
              </>
            ) : (
              <button
                onClick={onComplete}
                className="lt-btn lt-btn--primary lt-btn--lg lt-btn--block"
              >
                Pagar ${total.toLocaleString("en-US")} <Icon name="check" size={16}/>
              </button>
            )}

            {step > 1 && (
              <button onClick={() => setStep(s => s - 1)} className="lt-btn lt-btn--ghost lt-btn--block">
                Atrás
              </button>
            )}
          </aside>
        </div>
      </div>
    </section>
  );
}

window.CheckoutScreen = CheckoutScreen;

  </script>

  <script type="text/babel">
// account.jsx — Panel de cuenta con pestañas: Overview · Mis pedidos · Favoritos · Configuración

// ── Helpers locales ───────────────────────────────────────────────────────────
function ACard({ title, children, action }) {
  return (
    <div style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 12, padding: 24 }}>
      {title && (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 18 }}>
          <h3 style={{ font: "700 16px/1 var(--font-sans)", letterSpacing: "-0.01em" }}>{title}</h3>
          {action}
        </div>
      )}
      {children}
    </div>
  );
}

function SectionTitle({ eyebrow, title }) {
  return (
    <div>
      {eyebrow && <span className="lt-overline" style={{ color: "var(--fg-3)" }}>{eyebrow}</span>}
      <h1 style={{ font: "900 36px/1 var(--font-display)", letterSpacing: "-0.04em", marginTop: eyebrow ? 8 : 0 }}>{title}</h1>
    </div>
  );
}

function Toggle({ on, onChange }) {
  return (
    <div
      onClick={onChange}
      style={{
        width: 42, height: 24, borderRadius: 999, cursor: "pointer", flexShrink: 0,
        background: on ? "var(--brand-red)" : "var(--surface-3)",
        position: "relative", transition: "background .2s",
        boxShadow: on ? "0 0 10px -2px var(--brand-red-glow)" : "none",
      }}
    >
      <span style={{
        position: "absolute", top: 4, left: on ? 22 : 4,
        width: 16, height: 16, borderRadius: 999,
        background: "#fff",
        transition: "left .2s var(--ease-out)",
        boxShadow: "0 1px 4px rgba(0,0,0,0.35)",
      }}/>
    </div>
  );
}

function KPI({ label, value, sub, accent }) {
  return (
    <div style={{
      background: "var(--surface)",
      border: `1px solid ${accent ? "var(--brand-red)" : "var(--border)"}`,
      boxShadow: accent ? "var(--shadow-glow-red)" : "none",
      borderRadius: 12, padding: 18,
    }}>
      <span className="lt-overline" style={{ color: "var(--fg-3)" }}>{label}</span>
      <div style={{
        font: "900 30px/1 var(--font-display)", letterSpacing: "-0.03em",
        marginTop: 8, color: accent ? "var(--brand-red)" : "var(--fg)",
      }}>{value}</div>
      {sub && <div style={{ color: "var(--fg-3)", fontSize: 12, marginTop: 4 }}>{sub}</div>}
    </div>
  );
}

function StatusBadge({ status }) {
  const map = {
    "entregado":  { tone: "lime", label: "Entregado" },
    "en camino":  { tone: "red",  label: "En camino" },
    "procesando": { tone: "warn", label: "Procesando" },
    "cancelado":  { tone: "ghost",label: "Cancelado" },
  };
  const s = map[(status || "").toLowerCase()] || { tone: "ghost", label: status };
  return <Badge tone={s.tone} dot={s.tone === "red"}>{s.label}</Badge>;
}

// ── TAB: OVERVIEW ─────────────────────────────────────────────────────────────
function OverviewTab({ account, authUser, products, favs, onOpen, onTab }) {
  const user    = authUser || {};
  const displayName = user.name || account.name || "Gamer";
  const firstName   = displayName.split(" ")[0];
  const tierVal     = user.tier || account.tier || "FREE";
  const pointsVal   = user.points ?? account.points ?? 0;
  const orders      = account.orders || [];
  const lastOrder   = orders[0];
  const favList     = products.filter(p => favs && favs.has(p.id)).slice(0, 3);

  return (
    <>
      {/* Saludo */}
      <div>
        <span className="lt-overline" style={{ color: "var(--fg-3)" }}>Tu cuenta</span>
        <h1 style={{ font: "900 42px/1 var(--font-display)", letterSpacing: "-0.04em", marginTop: 8 }}>
          Hola, {firstName} <span style={{ fontSize: 34 }}>👋</span>
        </h1>
        <p style={{ color: "var(--fg-2)", marginTop: 10, fontSize: 14 }}>
          Tienes {orders.length} pedido{orders.length !== 1 ? "s" : ""} con nosotros{favList.length > 0 ? ` y ${favs.size} favorito${favs.size !== 1 ? "s" : ""}` : ""}.
        </p>
      </div>

      {/* KPIs */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 14 }}>
        <KPI label="Puntos LT"      value={pointsVal.toLocaleString("en-US")} sub="Úsalos en tu próximo pedido" accent/>
        <KPI label="Pedidos totales" value={orders.length}/>
        <KPI label="Tier"           value={tierVal} sub={tierVal === "Pro" ? "Envío express gratis" : "Sube a Pro por $999"}/>
      </div>

      {/* Último pedido */}
      {lastOrder && (
        <ACard
          title="Tu último pedido"
          action={<a onClick={() => onTab("orders")} style={{ font: "500 12px/1 var(--font-sans)", color: "var(--brand-red)", cursor: "pointer" }}>Ver todos</a>}
        >
          <div style={{ display: "flex", alignItems: "center", gap: 16, paddingBottom: 16 }}>
            <div style={{ width: 48, height: 48, borderRadius: 12, background: "rgb(239 43 43 / 0.12)", color: "var(--brand-red)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
              <Icon name="truck" size={20}/>
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
                <span style={{ font: "700 15px/1 var(--font-sans)" }}>#{lastOrder.id}</span>
                <StatusBadge status={lastOrder.status}/>
              </div>
              <div style={{ color: "var(--fg-3)", fontSize: 12 }}>
                {lastOrder.date} · ${(lastOrder.total || 0).toLocaleString("en-US")}
              </div>
            </div>
            <Button variant="secondary" onClick={() => onTab("orders")}>Ver detalles</Button>
          </div>
          {/* Barra de progreso del estado */}
          <div style={{ height: 5, background: "var(--surface-2)", borderRadius: 999, overflow: "hidden" }}>
            <div style={{
              width: lastOrder.status === "entregado" ? "100%" :
                     lastOrder.status === "en camino" ? "60%" : "25%",
              height: "100%",
              background: "linear-gradient(90deg, var(--brand-red), #ff3b3b)",
              borderRadius: 999, boxShadow: "0 0 10px -2px var(--brand-red-glow)",
              transition: "width .6s ease",
            }}/>
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6, fontSize: 11, color: "var(--fg-3)" }}>
            <span>Confirmado</span>
            <span style={{ color: lastOrder.status === "en camino" ? "var(--brand-red)" : "inherit" }}>En camino</span>
            <span style={{ color: lastOrder.status === "entregado" ? "var(--neon-lime)" : "inherit" }}>Entregado</span>
          </div>
        </ACard>
      )}

      {/* Favoritos preview */}
      {favList.length > 0 ? (
        <ACard
          title="Tus favoritos"
          action={<a onClick={() => onTab("favorites")} style={{ font: "500 12px/1 var(--font-sans)", color: "var(--brand-red)", cursor: "pointer" }}>Ver todos</a>}
        >
          <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 10 }}>
            {favList.map(p => (
              <div key={p.id} onClick={() => onOpen(p)} style={{ display: "flex", gap: 10, padding: 10, background: "var(--surface-2)", border: "1px solid var(--border)", borderRadius: 10, cursor: "pointer", transition: "border-color .15s" }}
                onMouseEnter={e => e.currentTarget.style.borderColor = "var(--brand-red)"}
                onMouseLeave={e => e.currentTarget.style.borderColor = "var(--border)"}
              >
                <div style={{ width: 48, height: 48, background: "linear-gradient(180deg,#0c0c0f,#050506)", borderRadius: 7, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                  <ProductImg shape={p.shape} size={42} imageUrl={p.imageUrl}/>
                </div>
                <div style={{ minWidth: 0 }}>
                  <div style={{ font: "600 12px/1.3 var(--font-sans)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.name}</div>
                  <div style={{ font: "700 12px/1 var(--font-sans)", color: "var(--brand-red)", marginTop: 4 }}>${(p.price || 0).toLocaleString("en-US")}</div>
                </div>
              </div>
            ))}
          </div>
        </ACard>
      ) : (
        <ACard title="Tus favoritos">
          <div style={{ textAlign: "center", padding: "20px 0", color: "var(--fg-4)" }}>
            <Icon name="heart" size={28} style={{ marginBottom: 10 }}/>
            <div style={{ font: "500 13px/1 var(--font-sans)", color: "var(--fg-3)" }}>Aún no tienes favoritos.</div>
            <div style={{ font: "400 12px/1.4 var(--font-sans)", color: "var(--fg-4)", marginTop: 4 }}>
              Pulsa el ❤ en cualquier producto para guardarlo aquí.
            </div>
          </div>
        </ACard>
      )}
    </>
  );
}

// ── TAB: MIS PEDIDOS ──────────────────────────────────────────────────────────
function OrdersTab({ account, products }) {
  const orders = account.orders || [];

  if (orders.length === 0) {
    return (
      <>
        <SectionTitle eyebrow="Historial" title="Mis pedidos"/>
        <div style={{ textAlign: "center", padding: "60px 20px", border: "1px dashed var(--border)", borderRadius: 12, background: "var(--surface)" }}>
          <Icon name="package" size={36} style={{ color: "var(--fg-4)", marginBottom: 14 }}/>
          <div style={{ font: "600 15px/1 var(--font-sans)", color: "var(--fg-2)", marginBottom: 6 }}>Todavía no tienes pedidos</div>
          <div style={{ font: "400 13px/1.4 var(--font-sans)", color: "var(--fg-4)" }}>Cuando completes tu primera compra, aparecerá aquí.</div>
        </div>
      </>
    );
  }

  return (
    <>
      <SectionTitle eyebrow="Historial" title="Mis pedidos"/>
      <p style={{ color: "var(--fg-2)", fontSize: 13, marginTop: -8 }}>
        {orders.length} pedido{orders.length !== 1 ? "s" : ""} · todos en su lugar.
      </p>

      <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        {orders.map(o => {
          const isActive = (o.status || "").toLowerCase() === "en camino";
          const lines = (o.items || [])
            .map(i => ({ ...i, p: products.find(p => p.id === i.id) }))
            .filter(l => l.p);

          return (
            <div key={o.id} style={{
              background: "var(--surface)",
              border: `1px solid ${isActive ? "var(--brand-red)" : "var(--border)"}`,
              boxShadow: isActive ? "var(--shadow-glow-red)" : "none",
              borderRadius: 12, padding: 20,
            }}>
              {/* Header del pedido */}
              <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 16 }}>
                <div>
                  <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 5 }}>
                    <span style={{ font: "700 15px/1 var(--font-sans)" }}>#{o.id}</span>
                    <StatusBadge status={o.status}/>
                  </div>
                  <div style={{ color: "var(--fg-3)", fontSize: 12 }}>
                    Pedido el {o.date}
                    {o.eta ? ` · ETA ${o.eta.toLowerCase()}` : ""}
                  </div>
                </div>
                <div style={{ textAlign: "right" }}>
                  <div style={{ font: "700 20px/1 var(--font-sans)" }}>${(o.total || 0).toLocaleString("en-US")}</div>
                  <a style={{ font: "400 11px/1 var(--font-sans)", color: "var(--brand-red)", cursor: "pointer" }}>Ver factura</a>
                </div>
              </div>

              {/* Productos del pedido o placeholder */}
              {lines.length > 0 ? (
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 16 }}>
                  {lines.map(l => (
                    <div key={l.id} style={{ display: "flex", gap: 10, padding: "8px 12px", background: "var(--surface-2)", border: "1px solid var(--border)", borderRadius: 8 }}>
                      <div style={{ width: 44, height: 44, background: "linear-gradient(180deg,#0c0c0f,#050506)", borderRadius: 6, display: "flex", alignItems: "center", justifyContent: "center" }}>
                        <ProductImg shape={l.p.shape} size={38} imageUrl={l.p.imageUrl}/>
                      </div>
                      <div>
                        <div style={{ font: "600 12px/1.2 var(--font-sans)", maxWidth: 140, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{l.p.name}</div>
                        <div style={{ font: "400 11px/1 var(--font-sans)", color: "var(--fg-3)", marginTop: 3 }}>×{l.q} · ${((l.p.price || 0) * l.q).toLocaleString("en-US")}</div>
                      </div>
                    </div>
                  ))}
                </div>
              ) : (
                <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 12px", background: "var(--surface-2)", borderRadius: 8, marginBottom: 16 }}>
                  <Icon name="package" size={14} style={{ color: "var(--fg-4)" }}/>
                  <span style={{ font: "400 12px/1 var(--font-sans)", color: "var(--fg-3)" }}>Detalles de artículos no disponibles</span>
                </div>
              )}

              {/* Barra progreso si está en camino */}
              {isActive && (
                <>
                  <div style={{ height: 5, background: "var(--surface-2)", borderRadius: 999, overflow: "hidden", marginBottom: 6 }}>
                    <div style={{ width: "60%", height: "100%", background: "linear-gradient(90deg, var(--brand-red), #ff3b3b)", borderRadius: 999, boxShadow: "0 0 10px -2px var(--brand-red-glow)" }}/>
                  </div>
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "var(--fg-3)", marginBottom: 14 }}>
                    <span>Confirmado</span><span style={{ color: "var(--brand-red)" }}>En camino</span><span>Entregado</span>
                  </div>
                </>
              )}

              {/* Acciones */}
              <div style={{ display: "flex", gap: 8 }}>
                {isActive && (
                  <Button variant="secondary"><Icon name="truck" size={14}/>Rastrear envío</Button>
                )}
                <Button variant="ghost">Volver a comprar</Button>
              </div>
            </div>
          );
        })}
      </div>
    </>
  );
}

// ── TAB: FAVORITOS ────────────────────────────────────────────────────────────
function FavoritesTab({ products, favs, onFav, onAdd, onOpen }) {
  const favList = products.filter(p => favs && favs.has(p.id));
  const [added, setAdded] = React.useState(new Set());

  const handleAdd = (p) => {
    onAdd(p);
    setAdded(s => new Set(s).add(p.id));
    setTimeout(() => setAdded(s => { const n = new Set(s); n.delete(p.id); return n; }), 1500);
  };

  return (
    <>
      <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between" }}>
        <SectionTitle eyebrow="Mi lista" title="Favoritos"/>
        {favList.length > 0 && (
          <span style={{ font: "500 12px/1 var(--font-mono)", color: "var(--fg-3)", marginBottom: 4 }}>
            {favList.length} producto{favList.length !== 1 ? "s" : ""}
          </span>
        )}
      </div>

      {favList.length === 0 ? (
        <div style={{ textAlign: "center", padding: "60px 20px", border: "1px dashed var(--border)", borderRadius: 12, background: "var(--surface)" }}>
          <div style={{ width: 64, height: 64, borderRadius: 16, background: "var(--surface-2)", border: "1px solid var(--border)", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 16px", color: "var(--fg-4)" }}>
            <Icon name="heart" size={28}/>
          </div>
          <div style={{ font: "600 15px/1 var(--font-sans)", color: "var(--fg-2)", marginBottom: 8 }}>Tu lista está vacía</div>
          <div style={{ font: "400 13px/1.5 var(--font-sans)", color: "var(--fg-4)", maxWidth: 280, margin: "0 auto" }}>
            Pulsa el <Icon name="heart" size={12} style={{ display: "inline", verticalAlign: "middle" }}/> en cualquier producto para guardarlo aquí.
          </div>
        </div>
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(260px, 1fr))", gap: 14 }}>
          {favList.map(p => {
            const isAdded = added.has(p.id);
            const stockNum = typeof p.stock === "number" ? p.stock : p.stock === "ok" ? 999 : p.stock === "low" ? (p.stockN || 3) : 0;
            const isOut = stockNum === 0;

            return (
              <div key={p.id} style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 12, overflow: "hidden", transition: "border-color .15s, transform .15s" }}
                onMouseEnter={e => { e.currentTarget.style.borderColor = "var(--border-strong)"; e.currentTarget.style.transform = "translateY(-2px)"; }}
                onMouseLeave={e => { e.currentTarget.style.borderColor = "var(--border)"; e.currentTarget.style.transform = "translateY(0)"; }}
              >
                {/* Imagen */}
                <div
                  onClick={() => onOpen(p)}
                  style={{ height: 140, background: "linear-gradient(180deg,#0c0c0f,#050506)", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", opacity: isOut ? 0.45 : 1 }}
                >
                  <ProductImg shape={p.shape} size={110} imageUrl={p.imageUrl}/>
                </div>

                {/* Info */}
                <div style={{ padding: "12px 14px 14px" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 4 }}>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ font: "600 13px/1.3 var(--font-sans)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.name}</div>
                      <div style={{ font: "400 11px/1 var(--font-sans)", color: "var(--fg-3)", marginTop: 3 }}>{p.brand} · {p.subcat}</div>
                    </div>
                    {/* Quitar de favoritos */}
                    <button
                      onClick={() => onFav(p)}
                      title="Quitar de favoritos"
                      style={{ background: "none", border: "none", color: "var(--brand-red)", cursor: "pointer", padding: "2px 4px", borderRadius: 6, flexShrink: 0, marginLeft: 8 }}
                    >
                      <Icon name="heart" size={16} fill={true}/>
                    </button>
                  </div>

                  {/* Stock */}
                  {isOut && (
                    <span className="lt-overline" style={{ color: "var(--fg-4)", display: "block", marginBottom: 8 }}>Agotado</span>
                  )}
                  {!isOut && stockNum <= 5 && (
                    <span className="lt-overline" style={{ color: "var(--warning)", display: "block", marginBottom: 8 }}>Quedan {stockNum}</span>
                  )}

                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 10 }}>
                    <span style={{ font: "700 16px/1 var(--font-sans)" }}>${(p.price || 0).toLocaleString("en-US")}</span>
                    <button
                      onClick={() => !isOut && !isAdded && handleAdd(p)}
                      disabled={isOut}
                      style={{
                        height: 32, padding: "0 14px", borderRadius: 8, border: "none",
                        font: "600 12px/1 var(--font-sans)", cursor: isOut ? "not-allowed" : "pointer",
                        background: isOut ? "var(--surface-2)" : isAdded ? "rgb(182 255 60 / 0.15)" : "var(--brand-red)",
                        color: isOut ? "var(--fg-4)" : isAdded ? "var(--neon-lime)" : "#fff",
                        display: "flex", alignItems: "center", gap: 5,
                        transition: "all .2s",
                        boxShadow: isOut || isAdded ? "none" : "var(--shadow-glow-red)",
                      }}
                    >
                      {isOut ? "Agotado" : isAdded ? <><Icon name="check" size={12}/>Añadido</> : <><Icon name="cart" size={12}/>Añadir</>}
                    </button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </>
  );
}

// ── TAB: CONFIGURACIÓN ────────────────────────────────────────────────────────
function SettingsTab({ account, authUser }) {
  const user = authUser || {};
  const [form, setForm] = React.useState({
    name:  user.name  || account.name  || "",
    email: user.email || account.email || "",
  });
  const [saved, setSaved] = React.useState(false);
  const [notifs, setNotifs] = React.useState({
    drops: true, offers: true, orders: true, newsletter: false,
  });
  const [pwForm, setPwForm] = React.useState({ current: "", next: "", confirm: "" });
  const [pwSaved, setPwSaved] = React.useState(false);
  const [pwErr, setPwErr] = React.useState("");

  const setF = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const setP = (k, v) => { setPwForm(f => ({ ...f, [k]: v })); setPwErr(""); };

  const handleSave = () => {
    setSaved(true);
    setTimeout(() => setSaved(false), 2500);
  };

  const handlePwSave = () => {
    if (!pwForm.current.trim())      { setPwErr("Ingresa tu contraseña actual."); return; }
    if (pwForm.next.length < 6)      { setPwErr("La nueva contraseña debe tener al menos 6 caracteres."); return; }
    if (pwForm.next !== pwForm.confirm) { setPwErr("Las contraseñas no coinciden."); return; }
    setPwSaved(true);
    setPwForm({ current: "", next: "", confirm: "" });
    setTimeout(() => setPwSaved(false), 2500);
  };

  const notifLabels = [
    { key: "drops",      label: "Drops semanales",              desc: "Nuevas llegadas y lanzamientos exclusivos" },
    { key: "offers",     label: "Ofertas y descuentos",         desc: "Alertas de precios y promos flash" },
    { key: "orders",     label: "Estado de mis pedidos",        desc: "Actualizaciones de envío y entrega" },
    { key: "newsletter", label: "Newsletter mensual",           desc: "Resumen del mes y novedades Life Tech" },
  ];

  const inputSt = { font: "400 14px/1 var(--font-sans)", height: 44 };

  return (
    <>
      <SectionTitle eyebrow="Tu cuenta" title="Configuración"/>

      {/* Datos personales */}
      <ACard title="Datos personales">
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
          <div className="lt-field">
            <label>Nombre</label>
            <input className="lt-input" style={inputSt} value={form.name} onChange={e => setF("name", e.target.value)}/>
          </div>
          <div className="lt-field">
            <label>Nickname</label>
            <input className="lt-input" style={inputSt} defaultValue={user.nickname || ""} readOnly style={{ ...inputSt, opacity: 0.6, cursor: "default" }}/>
          </div>
          <div className="lt-field" style={{ gridColumn: "span 2" }}>
            <label>Correo electrónico</label>
            <input className="lt-input" style={inputSt} value={form.email} onChange={e => setF("email", e.target.value)}/>
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginTop: 18 }}>
          <button
            onClick={handleSave}
            className="lt-btn lt-btn--primary"
          >
            {saved ? <><Icon name="check" size={14}/>Guardado</> : "Guardar cambios"}
          </button>
          {saved && (
            <span style={{ font: "400 12px/1 var(--font-sans)", color: "var(--neon-lime)", animation: "lt-fade-in .2s ease" }}>
              ✓ Cambios guardados correctamente
            </span>
          )}
        </div>
      </ACard>

      {/* Cambiar contraseña */}
      {(user.provider === "email" || !user.provider) && (
        <ACard title="Contraseña">
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <div className="lt-field">
              <label>Contraseña actual</label>
              <input className="lt-input" type="password" style={inputSt} placeholder="••••••••" value={pwForm.current} onChange={e => setP("current", e.target.value)}/>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
              <div className="lt-field">
                <label>Nueva contraseña</label>
                <input className="lt-input" type="password" style={inputSt} placeholder="Mín. 6 caracteres" value={pwForm.next} onChange={e => setP("next", e.target.value)}/>
              </div>
              <div className="lt-field">
                <label>Confirmar contraseña</label>
                <input className="lt-input" type="password" style={inputSt} placeholder="••••••••" value={pwForm.confirm} onChange={e => setP("confirm", e.target.value)}/>
              </div>
            </div>
            {pwErr && (
              <div style={{ display: "flex", alignItems: "center", gap: 6, color: "var(--brand-red)", font: "400 12px/1 var(--font-sans)" }}>
                <Icon name="close" size={11}/>{pwErr}
              </div>
            )}
            <div style={{ display: "flex", alignItems: "center", gap: 12, marginTop: 4 }}>
              <button onClick={handlePwSave} className="lt-btn lt-btn--secondary">
                {pwSaved ? <><Icon name="check" size={14}/>Actualizada</> : "Cambiar contraseña"}
              </button>
              {pwSaved && (
                <span style={{ font: "400 12px/1 var(--font-sans)", color: "var(--neon-lime)" }}>
                  ✓ Contraseña actualizada
                </span>
              )}
            </div>
          </div>
        </ACard>
      )}

      {/* Sesión Google badge */}
      {user.provider === "google" && (
        <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 16px", background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 12 }}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          <div>
            <div style={{ font: "600 13px/1 var(--font-sans)" }}>Cuenta vinculada con Google</div>
            <div style={{ font: "400 11px/1 var(--font-sans)", color: "var(--fg-3)", marginTop: 3 }}>{user.email}</div>
          </div>
          <span style={{ marginLeft: "auto" }}><Badge tone="lime">Vinculada</Badge></span>
        </div>
      )}

      {/* Notificaciones */}
      <ACard title="Notificaciones">
        <div style={{ display: "flex", flexDirection: "column" }}>
          {notifLabels.map(({ key, label, desc }) => (
            <div key={key} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "14px 0", borderTop: "1px solid var(--border-subtle)" }}>
              <div>
                <div style={{ font: "500 13px/1 var(--font-sans)", color: "var(--fg)" }}>{label}</div>
                <div style={{ font: "400 11px/1.3 var(--font-sans)", color: "var(--fg-4)", marginTop: 3 }}>{desc}</div>
              </div>
              <Toggle on={notifs[key]} onChange={() => setNotifs(n => ({ ...n, [key]: !n[key] }))}/>
            </div>
          ))}
        </div>
      </ACard>

      {/* Zona de peligro */}
      <div style={{ padding: 20, border: "1px solid rgb(239 43 43 / 0.3)", borderRadius: 12, background: "rgb(239 43 43 / 0.04)" }}>
        <div style={{ font: "700 14px/1 var(--font-sans)", color: "var(--brand-red)", marginBottom: 6 }}>Zona de peligro</div>
        <div style={{ font: "400 12px/1.4 var(--font-sans)", color: "var(--fg-3)", marginBottom: 14 }}>
          Eliminar tu cuenta es una acción permanente e irreversible. Se borrarán todos tus datos, pedidos y puntos.
        </div>
        <button
          disabled
          style={{ height: 34, padding: "0 16px", borderRadius: 8, border: "1px solid rgb(239 43 43 / 0.4)", background: "transparent", color: "var(--fg-4)", font: "600 12px/1 var(--font-sans)", cursor: "not-allowed", opacity: 0.5 }}
        >
          Eliminar mi cuenta
        </button>
      </div>
    </>
  );
}

function AccountScreen({ account, products, favs, onFav, onAdd, onOpen, onLogout, onShop, initialTab, authUser }) {
  const [tab, setTab] = React.useState(initialTab || "overview");

  // Sincroniza si se cambia la pestaña desde fuera (dropdown)
  React.useEffect(() => {

  const user = authUser || {};

  const avatarColor = user.color || "var(--brand-red)";

  const NAV = [
    { id: "overview",   label: "Overview",       icon: "home"     },
    { id: "orders",     label: "Mis pedidos",     icon: "package"  },

    { id: "settings",   label: "Configuración",   icon: "settings" },

  return (
    <section className="lt-section" style={{ paddingTop: 32 }}>
      <div className="lt-section-inner" style={{ display: "grid", gridTemplateColumns: "240px 1fr", gap: 32, alignItems: "flex-start" }}>

        {/* ── Sidebar ─────────────────────────────────────────────── */}
        <aside style={{ position: "sticky", top: 80, display: "flex", flexDirection: "column", gap: 16 }}>

          {/* Perfil */}
          <div style={{ display: "flex", alignItems: "center", gap: 12, padding: 16, background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 12 }}>
            <div style={{
              width: 46, height: 46, borderRadius: 999, flexShrink: 0,
              background: avatarColor,
              display: "flex", alignItems: "center", justifyContent: "center",

              boxShadow: "0 0 16px -4px rgba(0,0,0,0.5)",
            }}>
              {initials}
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ font: "700 13px/1.2 var(--font-sans)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                {displayName}
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 4 }}>
                <Badge tone={tierVal === "Pro" || tierVal === "PRO" ? "red" : "ghost"}>{tierVal}</Badge>
                <span className="lt-mono" style={{ color: "var(--fg-3)", fontSize: 10 }}>{pointsVal} pts</span>

              const active = tab === it.id;

                  key={it.id}
                  onClick={() => setTab(it.id)}
                  style={{
                    display: "flex", alignItems: "center", gap: 10,
                    padding: "10px 12px", borderRadius: 8, cursor: "pointer",
                    background: active ? "rgb(239 43 43 / 0.10)" : "transparent",
                    color: active ? "var(--fg)" : "var(--fg-2)",
                    font: `${active ? 600 : 400} 13px/1 var(--font-sans)`,

                  onMouseLeave={e => { if (!active) { e.currentTarget.style.background = "transparent"; e.currentTarget.style.color = "var(--fg-2)"; }}}
                >
                  <Icon name={it.icon} size={15}/>
                  {it.label}
                  {it.id === "favorites" && favs && favs.size > 0 && (
                    <span style={{ marginLeft: "auto", background: "var(--brand-red)", color: "#fff", font: "700 9px/1 var(--font-sans)", borderRadius: 999, padding: "2px 6px" }}>
                      {favs.size}

            <a
              onClick={onLogout}
              style={{
                display: "flex", alignItems: "center", gap: 10,
                padding: "10px 12px", borderRadius: 8, cursor: "pointer",
                color: "var(--fg-3)", font: "400 13px/1 var(--font-sans)",
                transition: "color .15s, background .15s",
              }}
              onMouseEnter={e => { e.currentTarget.style.color = "var(--brand-red)"; e.currentTarget.style.background = "rgb(239 43 43 / 0.08)"; }}
              onMouseLeave={e => { e.currentTarget.style.color = "var(--fg-3)"; e.currentTarget.style.background = "transparent"; }}
            >
              <Icon name="logout" size={15}/>
              Cerrar sesión
            </a>
          </nav>
        </aside>

        {/* ── Contenido de pestaña ─────────────────────────────────── */}
        <div style={{ display: "flex", flexDirection: "column", gap: 24, animation: "lt-fade-in .2s ease" }} key={tab}>
          {tab === "overview" && (
            <OverviewTab
              account={account} authUser={authUser} products={products}
              favs={favs || new Set()} onOpen={onOpen} onTab={setTab}
            />
          )}
          {tab === "orders" && (
            <OrdersTab account={account} products={products}/>

          {tab === "favorites" && (
            <FavoritesTab
              products={products}
              favs={favs || new Set()}
              onFav={onFav}
              onAdd={onAdd}
              onOpen={onOpen}
            />
          )}
          {tab === "settings" && (
            <SettingsTab account={account} authUser={authUser}/>
          )}
        </div>
      </div>
    </section>
  );
}
