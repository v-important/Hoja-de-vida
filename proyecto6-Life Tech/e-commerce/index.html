      };

      // Carrito — se restaura automáticamente si había sesión activa al cargar
      const [cart, setCart] = useState(() => {
        try {
          const auth = JSON.parse(localStorage.getItem("lt_auth") || "null");
          if (auth?.user?.email) {
            return JSON.parse(localStorage.getItem(`lt_cart_${auth.user.email}`) || "[]");
          }
        } catch {}
        return [];
      });
      const [favs, setFavs] = useState(new Set(["aurel"]));
      const [cartOpen, setCartOpen] = useState(false);
      const [toasts, setToasts] = useState([]);

      // Productos y marcas en estado reactivo — se actualizan desde la API cada 15 s
      const [products, setProducts] = useState(() => window.LT_DATA?.products || []);
      const [brands,   setBrands]   = useState({});
      const account = window.LT_DATA.account;

      useEffect(() => {
        function fetchProducts() {
          fetch("http://localhost:3001/api/public/products")
            .then(r => { if (!r.ok) throw new Error(); return r.json(); })
            .then(data => setProducts(data))
            .catch(() => {});
        }
        function fetchBrands() {
          fetch("http://localhost:3001/api/public/brands")
            .then(r => { if (!r.ok) throw new Error(); return r.json(); })
            .then(data => setBrands(data))
            .catch(() => {});
        }
        fetchProducts();
        fetchBrands();
        const id = setInterval(() => { fetchProducts(); fetchBrands(); }, 15_000);
        return () => clearInterval(id);
      }, []);

      useEffect(() => {
        window.scrollTo({ top: 0, behavior: "instant" });
      }, [route]);

      // Persiste el carrito en localStorage solo cuando hay sesión activa
      useEffect(() => {
        if (authUser?.email) {
          try { localStorage.setItem(`lt_cart_${authUser.email}`, JSON.stringify(cart)); } catch {}
        }
      }, [cart, authUser]);

      const cartCount = cart.reduce((n, l) => n + l.q, 0);

      const pushToast = (t) => {
        const id = Date.now() + Math.random();
        setToasts(s => [...s, { ...t, id }]);
        setTimeout(() => setToasts(s => s.filter(x => x.id !== id)), 2800);
      };

      const addToCart = (product, q = 1) => {
        // Guard: no añadir si el producto está agotado
        const stockNum =
          typeof product.stock === "number" ? product.stock :
          product.stock === "ok"  ? 999 :
          product.stock === "low" ? (product.stockN || 3) : 0;
        if (stockNum === 0) return;

        setCart(c => {
          const existing = c.find(l => l.id === product.id);
          if (existing) return c.map(l => l.id === product.id ? { ...l, q: l.q + q } : l);
          return [...c, { id: product.id, q }];
        });

        // Abre el panel del carrito automáticamente
        setCartOpen(true);
      };

      const setQty = (id, q) => {
        if (q <= 0) return setCart(c => c.filter(l => l.id !== id));
        setCart(c => c.map(l => l.id === id ? { ...l, q } : l));
      };

      const toggleFav = (p) => {
        setFavs(s => {
          const n = new Set(s);
          if (n.has(p.id)) n.delete(p.id); else n.add(p.id);
          return n;
        });
      };

      const onShop    = (cat) => setRoute({ name: "shop", cat: cat || "all" });
      const onOffers  = ()    => setRoute({ name: "offers" });
      const onOpen    = (p)   => setRoute({ name: "product", id: p.id });
      const onAccount = (tab) => setRoute({ name: "account", tab: tab || "overview" });
      const onCart     = ()    => setCartOpen(true);
      const onLogo     = ()    => setRoute({ name: "home" });
      const onCheckout = ()    => { setCartOpen(false); setRoute({ name: "checkout" }); };
      const onOrderComplete = () => {
        setCart([]);
        pushToast({ title: "¡Pedido confirmado!", sub: "Te avisamos cuando salga", icon: "check" });
        setRoute({ name: "account" });
      };

      const screen = (() => {
        switch (route.name) {
          case "home":
            return <HomeScreen products={products} brands={brands} onShop={onShop} onAdd={addToCart} onOpen={onOpen} favs={favs} onFav={toggleFav}/>;
          case "shop":
            return <ShopScreen key={route.cat || "all"} products={products} onAdd={addToCart} onOpen={onOpen} favs={favs} onFav={toggleFav} initialCat={route.cat} brands={brands}/>;
          case "product": {
            const p = products.find(x => x.id === route.id) || products[0];
            return <ProductScreen product={p} products={products} onAdd={addToCart} onOpen={onOpen} onBack={onShop} favs={favs} onFav={toggleFav}/>;
          }
          case "offers":
            return <OffersScreen products={products} onAdd={addToCart} onOpen={onOpen} favs={favs} onFav={toggleFav}/>;
          case "checkout":
            return <CheckoutScreen cart={cart} products={products} account={account} onComplete={onOrderComplete} onBack={() => setRoute({ name: "home" })}/>;
          case "account":
            return <AccountScreen
              account={account}
              products={products}
              favs={favs}
              onFav={toggleFav}
              onAdd={addToCart}
              onOpen={onOpen}
              onLogout={handleLogout}
              onShop={onShop}
              initialTab={route.tab}
              authUser={authUser}
            />;
          default:
            return null;
        }
      })();

      return (
        <>
          <Header
            route={route.name === "shop" ? `shop:${route.cat}` : route.name === "offers" ? "shop:ofer" : route.name}
            onNav={(_, cat) => cat === "ofer" ? onOffers() : onShop(cat)}
            cartCount={cartCount}
            onCart={onCart}
            onAccount={onAccount}
            onLogo={onLogo}
            authUser={authUser}
            onAuthOpen={() => setAuthOpen(true)}
            onLogout={handleLogout}
          />
          <main key={route.name + (route.cat || "")} className="lt-page-in">{screen}</main>
          <Footer/>

          {cartOpen && (
            <CartSheet
              cart={cart}
              products={products}
              onClose={() => setCartOpen(false)}
              onQty={setQty}
              onCheckout={onCheckout}
              onShop={() => { setCartOpen(false); onShop(); }}
            />
          )}

          <ToastStack toasts={toasts}/>
          {authOpen && <AuthPanel onClose={() => setAuthOpen(false)} onLogin={handleLogin}/>}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("app")).render(<App/>);
  </script>
</body>
</html>
