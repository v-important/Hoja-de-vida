<!doctype html><html lang="es"><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  body{margin:0;padding:24px;background:var(--bg);display:flex;flex-direction:column;gap:18px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .chip{font:600 12px/1 var(--font-sans);height:32px;padding:0 14px;border:1px solid var(--border);border-radius:999px;color:var(--fg-2);background:var(--surface);display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:all .22s var(--ease-out)}
  .chip:hover{border-color:var(--border-strong)}
  .chip.on{border-color:var(--brand-red);background:rgb(239 43 43 / .12);color:var(--fg)}
  .chip.on::before{content:"✓";color:var(--brand-red);font-weight:700}
  label{font:600 10px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3)}
</style></head>
<body class="lt">
  <div class="row" style="gap:10px;flex-direction:column;align-items:flex-start">
    <label>Marca</label>
    <div class="row">
      <span class="chip on">Razer</span>
      <span class="chip">Logitech</span>
      <span class="chip on">SteelSeries</span>
      <span class="chip">HyperX</span>
      <span class="chip">Corsair</span>
    </div>
  </div>
  <div class="row" style="gap:10px;flex-direction:column;align-items:flex-start">
    <label>Conexión</label>
    <div class="row">
      <span class="chip">USB-C</span>
      <span class="chip on">Inalámbrico</span>
      <span class="chip">Bluetooth</span>
    </div>
  </div>
</body></html>
