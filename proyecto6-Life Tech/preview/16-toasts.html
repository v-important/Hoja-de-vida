<!doctype html><html lang="es"><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  body{margin:0;padding:24px;background:var(--bg);display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .toast{padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:var(--surface);display:flex;gap:12px;align-items:center;box-shadow:var(--shadow-elevated)}
  .toast.success{border-left:3px solid var(--success)}
  .toast.error{border-left:3px solid var(--brand-red)}
  .toast.ai{border-left:3px solid var(--neon-cyan)}
  .toast.cart{border-left:3px solid var(--brand-red);box-shadow:var(--shadow-glow-red)}
  .ic{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
  .success .ic{background:rgb(34 197 94 / .15);color:var(--success)}
  .error .ic{background:rgb(239 43 43 / .15);color:var(--brand-red)}
  .ai .ic{background:rgb(34 211 238 / .15);color:var(--neon-cyan)}
  .cart .ic{background:rgb(239 43 43 / .15);color:var(--brand-red)}
  .copy{display:flex;flex-direction:column;gap:2px}
  .t{font:600 13px/1.3 var(--font-sans);color:var(--fg)}
  .s{font:400 12px/1.3 var(--font-sans);color:var(--fg-3)}
  svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
</style></head>
<body class="lt">
  <div class="toast cart"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></div><div class="copy"><span class="t">Añadido al carrito</span><span class="s">Teclado RX-91 Pro · 1 unidad</span></div></div>
  <div class="toast success"><div class="ic"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div><div class="copy"><span class="t">Pago confirmado</span><span class="s">Pedido #LT-2491 en camino</span></div></div>
  <div class="toast error"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6m0-6 6 6"/></svg></div><div class="copy"><span class="t">Cupón expirado</span><span class="s">Intenta con otro código</span></div></div>
  <div class="toast ai"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg></div><div class="copy"><span class="t">IA: ajusté tu DPI a 1600</span><span class="s">Detectamos juegos de FPS en tu sesión</span></div></div>
</body></html>
