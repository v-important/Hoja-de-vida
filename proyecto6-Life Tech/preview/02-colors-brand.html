<!doctype html><html lang="es"><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  body{margin:0;padding:20px;background:var(--bg)}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  .sw{height:88px;border-radius:var(--radius-2);border:1px solid var(--border-subtle);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:10px}
  .sw .name{font:600 11px/1 var(--font-sans);color:#fff;text-shadow:0 1px 2px rgb(0 0 0 / .8)}
  .sw .hex{font:500 10px/1 var(--font-mono);color:rgb(255 255 255 / .75);margin-top:4px;text-shadow:0 1px 2px rgb(0 0 0 / .8)}
</style></head>
<body class="lt">
  <div class="grid">
    <div class="sw" style="background:#ef2b2b"><span class="name">brand-red</span><span class="hex">#EF2B2B</span></div>
    <div class="sw" style="background:#ff3b3b"><span class="name">red-hover</span><span class="hex">#FF3B3B</span></div>
    <div class="sw" style="background:#d91a1a"><span class="name">red-press</span><span class="hex">#D91A1A</span></div>
    <div class="sw" style="background:#2a0d10"><span class="name">red-soft</span><span class="hex">#2A0D10</span></div>
    <div class="sw" style="background:#ffe600"><span class="name" style="color:#050506;text-shadow:none">neon-amarillo</span><span class="hex" style="color:rgb(5 5 6 / .7);text-shadow:none">#FFE600</span></div>
    <div class="sw" style="background:#a855f7"><span class="name">neon-violeta</span><span class="hex">#A855F7</span></div>
  </div>
</body></html>
