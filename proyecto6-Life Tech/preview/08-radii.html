<!doctype html><html lang="es"><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  body{margin:0;padding:20px;background:var(--bg);display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
  .box{background:var(--surface-2);border:1px solid var(--border);height:84px;display:flex;align-items:flex-end;padding:10px;flex-direction:column;justify-content:flex-end}
  .v{font:500 11px/1 var(--font-mono);color:var(--fg-2)}
  .tok{font:600 10px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);margin-top:3px}
</style></head>
<body class="lt">
  <div class="box" style="border-radius:4px"><span class="tok">radius-1</span><span class="v">4px</span></div>
  <div class="box" style="border-radius:8px"><span class="tok">radius-2</span><span class="v">8px</span></div>
  <div class="box" style="border-radius:12px"><span class="tok">radius-3</span><span class="v">12px</span></div>
  <div class="box" style="border-radius:20px"><span class="tok">radius-4</span><span class="v">20px</span></div>
  <div class="box" style="border-radius:999px"><span class="tok">pill</span><span class="v">999px</span></div>
</body></html>
