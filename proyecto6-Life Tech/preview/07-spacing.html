<!doctype html><html lang="es"><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  body{margin:0;padding:18px;background:var(--bg);display:flex;gap:24px;align-items:flex-end}
  .b{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  .bar{background:var(--brand-red);border-radius:2px;width:36px;box-shadow:0 0 16px -4px rgb(239 43 43 / .55)}
  .v{font:500 11px/1 var(--font-mono);color:var(--fg-2)}
  .tok{font:600 10px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3)}
</style></head>
<body class="lt">
  <div class="b"><div class="bar" style="height:4px"></div><span class="v">4</span><span class="tok">1</span></div>
  <div class="b"><div class="bar" style="height:8px"></div><span class="v">8</span><span class="tok">2</span></div>
  <div class="b"><div class="bar" style="height:12px"></div><span class="v">12</span><span class="tok">3</span></div>
  <div class="b"><div class="bar" style="height:16px"></div><span class="v">16</span><span class="tok">4</span></div>
  <div class="b"><div class="bar" style="height:24px"></div><span class="v">24</span><span class="tok">5</span></div>
  <div class="b"><div class="bar" style="height:32px"></div><span class="v">32</span><span class="tok">6</span></div>
  <div class="b"><div class="bar" style="height:48px"></div><span class="v">48</span><span class="tok">7</span></div>
  <div class="b"><div class="bar" style="height:64px"></div><span class="v">64</span><span class="tok">8</span></div>
  <div class="b"><div class="bar" style="height:96px"></div><span class="v">96</span><span class="tok">9</span></div>
  <div class="b"><div class="bar" style="height:128px"></div><span class="v">128</span><span class="tok">10</span></div>
</body></html>
