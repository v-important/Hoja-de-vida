<!doctype html><html lang="es"><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  body{margin:0;padding:20px;background:var(--bg)}
  .stack{display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:baseline;gap:18px;border-bottom:1px solid var(--border-subtle);padding-bottom:8px}
  .row:last-child{border:0}
  .label{width:120px;flex:none;font:600 10px/1 "Inter",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3)}
  .specimen{color:var(--fg);text-wrap:balance;font-family:"Chakra Petch",sans-serif}
  .red{color:var(--brand-red)}
</style></head>
<body class="lt">
  <div class="stack">
    <div class="row"><span class="label">Display · Chakra Petch</span><span class="specimen" style="font-weight:700;font-size:56px;line-height:1;letter-spacing:-.02em;text-transform:uppercase">Tu vida, <span class="red">tu setup.</span></span></div>
    <div class="row"><span class="label">H1</span><span class="specimen" style="font-weight:700;font-size:36px;line-height:1.1;letter-spacing:-.01em">Cada tecla, un disparo limpio</span></div>
    <div class="row"><span class="label">H2</span><span class="specimen" style="font-weight:600;font-size:24px;line-height:1.2;letter-spacing:0">Construye tu próximo nivel</span></div>
  </div>
</body></html>
