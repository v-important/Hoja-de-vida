<!doctype html><html lang="es"><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  body{margin:0;padding:24px;background:var(--bg);display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  button{font:600 14px/1 var(--font-sans);border-radius:var(--radius-2);padding:0 18px;height:42px;cursor:pointer;border:1px solid transparent;transition:all .22s var(--ease-out);display:inline-flex;align-items:center;gap:8px}
  .primary{background:var(--brand-red);color:var(--fg-on-brand);box-shadow:var(--shadow-glow-red)}
  .primary:hover{background:var(--brand-red-hover);box-shadow:var(--shadow-glow-red-strong);transform:translateY(-1px)}
  .secondary{background:var(--surface-2);color:var(--fg);border-color:var(--border)}
  .secondary:hover{border-color:var(--border-strong);background:var(--surface-3)}
  .ghost{background:transparent;color:var(--fg);border-color:transparent}
  .ghost:hover{background:var(--surface-2)}
  .icon{width:42px;padding:0;justify-content:center}
  .pill{height:32px;padding:0 14px;font-size:12px;border-radius:999px}
  .lg{height:52px;padding:0 24px;font-size:15px}
  svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
</style></head>
<body class="lt">
  <button class="primary lg">Comprar ahora</button>
  <button class="primary">Añadir<svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></button>
  <button class="secondary">Ver más</button>
  <button class="ghost">Cancelar</button>
  <button class="primary pill">Nuevo</button>
  <button class="secondary icon"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button>
</body></html>
